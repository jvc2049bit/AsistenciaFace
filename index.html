<!DOCTYPE html>
<html lang="es">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0">

  <title>AsistenciaFace</title>


  <!--
  ==========================================
  FACE-API.JS
  ==========================================
  -->

  <script
    src="https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/dist/face-api.min.js">
  </script>


  <style>

    * {
      box-sizing: border-box;
    }


    body {

      margin: 0;

      min-height: 100vh;

      font-family:
        Arial,
        Helvetica,
        sans-serif;

      background:
        linear-gradient(
          135deg,
          #eef2ff,
          #f8fafc
        );

      display: flex;

      justify-content: center;

      align-items: center;

      padding: 20px;

    }


    .contenedor {

      width: 100%;

      max-width: 760px;

      background: white;

      border-radius: 22px;

      padding: 25px;

      box-shadow:
        0 15px 40px
        rgba(0,0,0,.15);

      text-align: center;

    }


    h1 {

      margin:
        0 0 5px 0;

      color: #111827;

    }


    .subtitulo {

      margin:
        0 0 20px 0;

      color: #6b7280;

    }


    #estado {

      padding: 14px;

      border-radius: 12px;

      background: #f3f4f6;

      color: #111827;

      font-weight: bold;

      margin-bottom: 20px;

    }


    #empleado {

      font-size: 22px;

      font-weight: bold;

      color: #047857;

      margin-bottom: 15px;

    }


    #zonaVideo {

      position: relative;

      width: 100%;

      max-width: 640px;

      margin: auto;

      overflow: hidden;

      border-radius: 18px;

      background: #000;

    }


    #video {

      width: 100%;

      display: block;

      transform:
        scaleX(-1);

    }


    #canvas {

      position: absolute;

      top: 0;

      left: 0;

      width: 100%;

      height: 100%;

      transform:
        scaleX(-1);

    }


    .botones {

      margin-top: 20px;

    }


    button {

      width: 100%;

      padding: 15px;

      border: none;

      border-radius: 12px;

      background: #2563eb;

      color: white;

      font-size: 18px;

      font-weight: bold;

      cursor: pointer;

    }


    button:hover {

      background: #1d4ed8;

    }


    button:disabled {

      background: #9ca3af;

      cursor: not-allowed;

    }


    #resultado {

      margin-top: 20px;

      font-size: 18px;

      font-weight: bold;

    }


    .info {

      margin-top: 20px;

      padding: 15px;

      background: #f9fafb;

      border-radius: 12px;

      text-align: left;

      font-size: 14px;

      color: #374151;

    }


    .fila {

      margin-bottom: 8px;

    }


  </style>

</head>


<body>


<div class="contenedor">


  <h1>
    AsistenciaFace
  </h1>


  <p class="subtitulo">
    Sistema biométrico de control de asistencia
  </p>


  <div id="estado">
    Inicializando sistema...
  </div>


  <div id="empleado">
    Esperando reconocimiento...
  </div>


  <div id="zonaVideo">

    <video
      id="video"
      autoplay
      muted
      playsinline>
    </video>

    <canvas id="canvas"></canvas>

  </div>


  <div class="botones">

    <button
      id="btnCamara">

      📷 Iniciar cámara

    </button>

  </div>


  <div id="resultado"></div>


  <div class="info">

    <div class="fila">
      <strong>Estado:</strong>
      <span id="infoEstado">
        Preparando...
      </span>
    </div>

    <div class="fila">
      <strong>Empleado:</strong>
      <span id="infoEmpleado">
        —
      </span>
    </div>

    <div class="fila">
      <strong>GPS:</strong>
      <span id="infoGPS">
        Pendiente
      </span>
    </div>

  </div>


</div>


<script>


/*
==================================================
CONFIGURACIÓN
==================================================
*/


const APPS_SCRIPT_URL =
  'https://script.google.com/macros/s/AKfycbwSnVCHj2qiKd9JfCembdLIJ8bFuFYQBJ-2D4xE25i0PHhJKDdOuAdps4aa3a5-E9sy/exec';


const MODEL_URL =
  'https://cdn.jsdelivr.net/gh/justadudewhohacks/face-api.js/weights';


const UMBRAL =
  0.60;


/*
==================================================
ELEMENTOS
==================================================
*/


const video =
  document.getElementById(
    'video'
  );


const canvas =
  document.getElementById(
    'canvas'
  );


const estado =
  document.getElementById(
    'estado'
  );


const empleado =
  document.getElementById(
    'empleado'
  );


const resultado =
  document.getElementById(
    'resultado'
  );


const boton =
  document.getElementById(
    'btnCamara'
  );


const infoEstado =
  document.getElementById(
    'infoEstado'
  );


const infoEmpleado =
  document.getElementById(
    'infoEmpleado'
  );


const infoGPS =
  document.getElementById(
    'infoGPS'
  );


/*
==================================================
VARIABLES
==================================================
*/


let descriptorReferencia =
  null;


let nombreEmpleado =
  '';


let codigoEmpleado =
  '';


let streamCamara =
  null;


let intervalo =
  null;


let reconocimientoConfirmado =
  false;


let tiempoReconocimiento =
  null;


/*
==================================================
INICIO
==================================================
*/


window.addEventListener(
  'load',
  iniciarSistema
);


/*
==================================================
INICIAR SISTEMA
==================================================
*/


async function iniciarSistema() {


  try {


    console.log(
      '================================='
    );


    console.log(
      'INICIANDO ASISTENCIA FACE'
    );


    estado.textContent =
      'Cargando modelos de reconocimiento...';


    infoEstado.textContent =
      'Cargando modelos';


    /*
    ==========================================
    MODELO 1
    ==========================================
    */


    console.log(
      'Cargando TinyFaceDetector...'
    );


    await faceapi.nets.tinyFaceDetector
      .loadFromUri(
        MODEL_URL
      );


    console.log(
      'TinyFaceDetector OK'
    );


    /*
    ==========================================
    MODELO 2
    ==========================================
    */


    console.log(
      'Cargando FaceLandmark68...'
    );


    await faceapi.nets.faceLandmark68Net
      .loadFromUri(
        MODEL_URL
      );


    console.log(
      'FaceLandmark68 OK'
    );


    /*
    ==========================================
    MODELO 3
    ==========================================
    */


    console.log(
      'Cargando FaceRecognition...'
    );


    await faceapi.nets.faceRecognitionNet
      .loadFromUri(
        MODEL_URL
      );


    console.log(
      'FaceRecognition OK'
    );


    /*
    ==========================================
    OBTENER REFERENCIA
    ==========================================
    */


    estado.textContent =
      'Obteniendo fotografía de referencia...';


    infoEstado.textContent =
      'Obteniendo referencia';


    console.log(
      'Solicitando fotografía a Apps Script...'
    );


    const referencia =
      await obtenerReferencia();


    console.log(
      'Fotografía recibida'
    );


    codigoEmpleado =
      referencia.codigo;


    nombreEmpleado =
      referencia.nombre;


    infoEmpleado.textContent =
      nombreEmpleado;


    empleado.textContent =
      'Empleado: ' +
      nombreEmpleado;


    /*
    ==========================================
    CREAR IMAGEN
    ==========================================
    */


    const imagen =
      await crearImagenDesdeBase64(
        referencia.base64,
        referencia.tipo
      );


    console.log(
      'Imagen de referencia cargada'
    );


    /*
    ==========================================
    CREAR DESCRIPTOR
    ==========================================
    */


    estado.textContent =
      'Analizando fotografía de referencia...';


    infoEstado.textContent =
      'Creando descriptor facial';


    const deteccion =
      await faceapi
        .detectSingleFace(
          imagen,
          new faceapi.TinyFaceDetectorOptions()
        )
        .withFaceLandmarks()
        .withFaceDescriptor();


    if (!deteccion) {

      throw new Error(
        'No se encontró un rostro en la fotografía de referencia.'
      );

    }


    descriptorReferencia =
      deteccion.descriptor;


    console.log(
      'Descriptor de referencia creado'
    );


    console.log(
      'Dimensión:',
      descriptorReferencia.length
    );


    estado.textContent =
      'Sistema preparado. Pulsa Iniciar cámara.';


    infoEstado.textContent =
      'Sistema preparado';


    boton.disabled =
      false;


  }


  catch (error) {


    console.error(
      'ERROR INICIALIZANDO:',
      error
    );


    estado.textContent =
      'ERROR: ' +
      error.message;


    infoEstado.textContent =
      'Error';


  }

}


/*
==================================================
OBTENER FOTO DESDE APPS SCRIPT
==================================================
*/


function obtenerReferencia() {


  return new Promise(
    function(resolve, reject) {


      const callback =
        'referencia_' +
        Date.now();


      window[callback] =
        function(respuesta) {


          console.log(
            'RESPUESTA REFERENCIA:',
            respuesta
          );


          delete window[
            callback
          ];


          if (
            respuesta &&
            respuesta.ok === false
          ) {

            reject(
              new Error(
                respuesta.error ||
                'Apps Script devolvió un error.'
              )
            );

            return;

          }


          if (
            !respuesta ||
            !respuesta.base64
          ) {

            reject(
              new Error(
                'Apps Script no devolvió la fotografía.'
              )
            );

            return;

          }


          resolve(
            respuesta
          );


        };


      const script =
        document.createElement(
          'script'
        );


      script.src =
        APPS_SCRIPT_URL +
        '?callback=' +
        encodeURIComponent(
          callback
        ) +
        '&accion=obtenerReferencia';


      script.onerror =
        function() {


          delete window[
            callback
          ];


          reject(
            new Error(
              'No se pudo conectar con Apps Script.'
            )
          );


        };


      document.body.appendChild(
        script
      );


    }
  );

}


/*
==================================================
CREAR IMAGEN BASE64
==================================================
*/


function crearImagenDesdeBase64(
  base64,
  tipo
) {


  return new Promise(
    function(resolve, reject) {


      const imagen =
        new Image();


      imagen.onload =
        function() {

          resolve(
            imagen
          );

        };


      imagen.onerror =
        function() {

          reject(
            new Error(
              'No se pudo cargar la imagen de referencia.'
            )
          );

        };


      imagen.src =
        'data:' +
        tipo +
        ';base64,' +
        base64;

    }
  );

}


/*
==================================================
BOTÓN CÁMARA
==================================================
*/


boton.addEventListener(
  'click',
  iniciarCamara
);


/*
==================================================
INICIAR CÁMARA
==================================================
*/


async function iniciarCamara() {


  try {


    console.log(
      'BOTÓN CÁMARA PRESIONADO'
    );


    estado.textContent =
      'Solicitando permiso de cámara...';


    infoEstado.textContent =
      'Solicitando cámara';


    if (
      !navigator.mediaDevices ||
      !navigator.mediaDevices.getUserMedia
    ) {

      throw new Error(
        'El navegador no permite acceso a la cámara.'
      );

    }


    streamCamara =
      await navigator.mediaDevices
        .getUserMedia({

          video: {

            width: {
              ideal: 640
            },

            height: {
              ideal: 480
            },

            facingMode:
              'user'

          },

          audio: false

        });


    console.log(
      'CÁMARA OBTENIDA CORRECTAMENTE'
    );


    video.srcObject =
      streamCamara;


    await video.play();


    canvas.width =
      video.videoWidth;


    canvas.height =
      video.videoHeight;


    faceapi.matchDimensions(
      canvas,
      {
        width:
          video.videoWidth,

        height:
          video.videoHeight
      }
    );


    boton.disabled =
      true;


    boton.textContent =
      '📷 Cámara activa';


    estado.textContent =
      'Buscando rostro...';


    infoEstado.textContent =
      'Cámara activa';


    iniciarDeteccion();


  }


  catch (error) {


    console.error(
      'ERROR CÁMARA:',
      error
    );


    estado.textContent =
      'ERROR: ' +
      error.name +
      ' - ' +
      error.message;


    infoEstado.textContent =
      'Error de cámara';


  }

}


/*
==================================================
DETECCIÓN FACIAL
==================================================
*/


function iniciarDeteccion() {


  if (intervalo) {

    clearInterval(
      intervalo
    );

  }


  intervalo =
    setInterval(
      detectarRostro,
      700
    );

}


/*
==================================================
DETECTAR ROSTRO
==================================================
*/


async function detectarRostro() {


  try {


    if (
      video.readyState < 2
    ) {

      return;

    }


    if (
      !descriptorReferencia
    ) {

      return;

    }


    const detecciones =
      await faceapi
        .detectAllFaces(
          video,
          new faceapi.TinyFaceDetectorOptions()
        )
        .withFaceLandmarks()
        .withFaceDescriptors();


    const resultados =
      faceapi.resizeResults(
        detecciones,
        {
          width:
            video.videoWidth,

          height:
            video.videoHeight
        }
      );


    const ctx =
      canvas.getContext(
        '2d'
      );


    ctx.clearRect(
      0,
      0,
      canvas.width,
      canvas.height
    );


    faceapi.draw.drawDetections(
      canvas,
      resultados
    );


    faceapi.draw.drawFaceLandmarks(
      canvas,
      resultados
    );


    if (
      resultados.length === 0
    ) {


      tiempoReconocimiento =
        null;


      empleado.textContent =
        'Buscando rostro...';


      estado.textContent =
        'Acércate a la cámara';


      return;

    }


    /*
    ==========================================
    TOMAR PRIMER ROSTRO
    ==========================================
    */


    const rostro =
      resultados[0];


    const distancia =
      faceapi.euclideanDistance(
        descriptorReferencia,
        rostro.descriptor
      );


    console.log(
      'Distancia facial:',
      distancia
    );


    /*
    ==========================================
    RECONOCIDO
    ==========================================
    */


    if (
      distancia <
      UMBRAL
    ) {


      empleado.textContent =
        '✅ ' +
        nombreEmpleado;


      estado.textContent =
        'Rostro reconocido';


      if (
        !tiempoReconocimiento
      ) {

        tiempoReconocimiento =
          Date.now();

      }


      const tiempo =
        Date.now() -
        tiempoReconocimiento;


      if (
        tiempo >= 1200 &&
        !reconocimientoConfirmado
      ) {


        reconocimientoConfirmado =
          true;


        await registrarAsistencia();


      }


    }


    else {


      tiempoReconocimiento =
        null;


      empleado.textContent =
        '❌ Rostro no reconocido';


      estado.textContent =
        'El rostro no coincide';


    }


  }


  catch (error) {


    console.error(
      'ERROR DETECTANDO:',
      error
    );


  }

}


/*
==================================================
REGISTRAR ASISTENCIA
==================================================
*/


async function registrarAsistencia() {


  try {


    estado.textContent =
      'Capturando fotografía...';


    /*
    ==========================================
    CAPTURAR FOTO
    ==========================================
    */


    const fotoCanvas =
      document.createElement(
        'canvas'
      );


    fotoCanvas.width =
      video.videoWidth;


    fotoCanvas.height =
      video.videoHeight;


    const ctx =
      fotoCanvas.getContext(
        '2d'
      );


    ctx.drawImage(
      video,
      0,
      0,
      video.videoWidth,
      video.videoHeight
    );


    const foto =
      fotoCanvas.toDataURL(
        'image/jpeg',
        0.85
      );


    /*
    ==========================================
    GPS
    ==========================================
    */


    estado.textContent =
      'Obteniendo ubicación GPS...';


    const posicion =
      await obtenerGPS();


    infoGPS.textContent =
      posicion.lat +
      ', ' +
      posicion.lng;


    /*
    ==========================================
    ENVIAR
    ==========================================
    */


    estado.textContent =
      'Registrando asistencia...';


    const respuesta =
      await enviarRegistro({

        empleado:
          nombreEmpleado,

        foto:
          foto,

        lat:
          posicion.lat,

        lng:
          posicion.lng,

        observacion:
          'Registro biométrico automático'

      });


    console.log(
      'REGISTRO:',
      respuesta
    );


    resultado.textContent =
      '✅ Asistencia registrada: ' +
      respuesta.tipo;


    estado.textContent =
      'Registro completado';


    /*
    ==========================================
    REINICIAR
    ==========================================
    */


    setTimeout(
      function() {


        reconocimientoConfirmado =
          false;


        tiempoReconocimiento =
          null;


        resultado.textContent =
          '';


        estado.textContent =
          'Buscando rostro...';


      },
      4000
    );


  }


  catch (error) {


    console.error(
      'ERROR REGISTRANDO:',
      error
    );


    estado.textContent =
      'ERROR: ' +
      error.message;


    resultado.textContent =
      '❌ No se pudo registrar';


    reconocimientoConfirmado =
      false;


    tiempoReconocimiento =
      null;


  }

}


/*
==================================================
GPS
==================================================
*/


function obtenerGPS() {


  return new Promise(
    function(resolve, reject) {


      if (
        !navigator.geolocation
      ) {

        reject(
          new Error(
            'El navegador no permite geolocalización.'
          )
        );

        return;

      }


      navigator.geolocation
        .getCurrentPosition(

          function(pos) {


            resolve({

              lat:
                pos.coords.latitude,

              lng:
                pos.coords.longitude

            });


          },


          function(error) {


            reject(
              new Error(
                'No se pudo obtener la ubicación GPS.'
              )
            );


          },


          {

            enableHighAccuracy:
              true,

            timeout:
              10000,

            maximumAge:
              0

          }

        );

    }
  );

}


/*
==================================================
ENVIAR REGISTRO A APPS SCRIPT
==================================================
*/


function enviarRegistro(
  datos
) {


  return new Promise(
    function(resolve, reject) {


      const callback =
        'registro_' +
        Date.now();


      window[callback] =
        function(respuesta) {


          console.log(
            'RESPUESTA APPS SCRIPT:',
            respuesta
          );


          delete window[
            callback
          ];


          if (
            respuesta &&
            respuesta.ok === false
          ) {


            reject(
              new Error(
                respuesta.error ||
                'Apps Script devolvió un error.'
              )
            );


            return;

          }


          if (
            !respuesta
          ) {


            reject(
              new Error(
                'No se recibió respuesta de Apps Script.'
              )
            );


            return;

          }


          resolve(
            respuesta
          );


        };


      const script =
        document.createElement(
          'script'
        );


      script.src =
        APPS_SCRIPT_URL +
        '?callback=' +
        encodeURIComponent(
          callback
        ) +
        '&datos=' +
        encodeURIComponent(
          JSON.stringify(
            datos
          )
        );


      script.onerror =
        function() {


          delete window[
            callback
          ];


          reject(
            new Error(
              'No se pudo conectar con Apps Script.'
            )
          );


        };


      document.body.appendChild(
        script
      );


    }
  );

}


</script>


</body>

</html>
