<script>

'use strict';


/* =====================================================
   CONFIGURACIÓN
===================================================== */

const SCRIPT_URL =
'https://script.google.com/macros/s/AKfycbwSnVCHj2qiKd9JfCembdLIJ8bFuFYQBJ-2D4xE25i0PHhJKDdOuAdps4aa3a5-E9sy/exec';


/*
 * =====================================================
 * IMPORTANTE
 * =====================================================
 *
 * YA NO EXISTE:
 *
 * const CODIGO_EMPLEADO = 'EMP001';
 *
 * El sistema ahora obtiene automáticamente
 * todos los empleados desde Apps Script.
 */


/*
 * Distancia máxima permitida.
 *
 * Menor distancia =
 * mayor similitud.
 */

const UMBRAL =
0.60;


/*
 * Coincidencias consecutivas necesarias.
 */

const COINCIDENCIAS_NECESARIAS =
3;


/*
 * Intervalo de análisis.
 */

const INTERVALO_DETECCION =
500;


/*
 * Modelos Face API.
 */

const MODELOS_URL =
'https://cdn.jsdelivr.net/gh/justadudewhohacks/face-api.js@0.22.2/weights';


/* =====================================================
   ELEMENTOS HTML
===================================================== */

const video =
document.getElementById('video');


const canvas =
document.getElementById('overlay');


const estado =
document.getElementById('estado');


const referencia =
document.getElementById('referencia');


const diagnostico =
document.getElementById('diagnostico');


const btnCamara =
document.getElementById('btnCamara');


/* =====================================================
   VARIABLES
===================================================== */


/*
 * Lista de empleados.
 */

let empleados =
[];


/*
 * Cada empleado tendrá:
 *
 * codigo
 * nombre
 * descriptor
 */

let descriptoresEmpleados =
[];


/*
 * Empleado identificado.
 */

let empleadoIdentificado =
null;


/*
 * Cámara.
 */

let camaraActiva =
false;


/*
 * Análisis.
 */

let analizando =
false;


/*
 * Bloqueo principal.
 */

let registroRealizado =
false;


/*
 * Bloqueo adicional.
 */

let enviandoRegistro =
false;


/*
 * Coincidencias consecutivas.
 */

let coincidenciasConsecutivas =
0;


/*
 * Última distancia.
 */

let ultimaDistancia =
null;


/*
 * Total detecciones.
 */

let totalDetecciones =
0;


/*
 * Último número de rostros.
 */

let ultimoNumeroRostros =
0;


/*
 * Último rostro.
 */

let ultimoRostro =
0;


/* =====================================================
   DIAGNÓSTICO
===================================================== */

function log(mensaje){

  console.log(
    mensaje
  );


  diagnostico.innerHTML +=
    '<br>' +
    mensaje;

}


/* =====================================================
   LIMPIAR DIAGNÓSTICO
===================================================== */

function limpiarDiagnostico(){

  diagnostico.innerHTML =
    'DIAGNÓSTICO DEL SISTEMA';

}


/* =====================================================
   INICIO DEL SISTEMA
===================================================== */

async function iniciarSistema(){

  try{

    limpiarDiagnostico();


    estado.textContent =
      'Inicializando sistema...';


    log(
      '================================='
    );


    log(
      'INICIO ASISTENCIA FACE'
    );


    log(
      '================================='
    );


    log(
      'MODO: RECONOCIMIENTO AUTOMÁTICO'
    );


    log(
      'UMBRAL FACIAL: ' +
      UMBRAL
    );


    log(
      'COINCIDENCIAS NECESARIAS: ' +
      COINCIDENCIAS_NECESARIAS
    );


    /* =================================================
       TINY FACE
    ================================================= */

    estado.textContent =
      'Cargando detector facial...';


    log(
      'Cargando TinyFaceDetector...'
    );


    await faceapi.nets.tinyFaceDetector
      .loadFromUri(
        MODELOS_URL
      );


    log(
      'TinyFaceDetector OK'
    );


    /* =================================================
       LANDMARKS
    ================================================= */

    log(
      'Cargando FaceLandmark68...'
    );


    await faceapi.nets.faceLandmark68Net
      .loadFromUri(
        MODELOS_URL
      );


    log(
      'FaceLandmark68 OK'
    );


    /* =================================================
       RECONOCIMIENTO
    ================================================= */

    log(
      'Cargando FaceRecognition...'
    );


    await faceapi.nets.faceRecognitionNet
      .loadFromUri(
        MODELOS_URL
      );


    log(
      'FaceRecognition OK'
    );


    log(
      'TODOS LOS MODELOS FACIALES CARGADOS'
    );


    /* =================================================
       CARGAR TODOS LOS EMPLEADOS
    ================================================= */

    estado.textContent =
      'Cargando referencias faciales...';


    await cargarTodasLasReferencias();


    estado.textContent =
      'Referencias cargadas. Pulsa Iniciar cámara.';


    referencia.textContent =
      'Sistema preparado: ' +
      empleados.length +
      ' referencias faciales cargadas';


    btnCamara.disabled =
      false;


    log(
      '================================='
    );


    log(
      'SISTEMA LISTO'
    );


    log(
      'REFERENCIAS DISPONIBLES: ' +
      empleados.length
    );


    log(
      'Pulsa "Iniciar cámara"'
    );


    log(
      '================================='
    );

  }

  catch(error){

    console.error(
      'ERROR INICIANDO SISTEMA:',
      error
    );


    estado.textContent =
      'ERROR: ' +
      error.message;


    log(
      '================================='
    );


    log(
      'ERROR DE INICIALIZACIÓN'
    );


    log(
      error.message
    );


    log(
      '================================='
    );

  }

}


/* =====================================================
   CARGAR TODAS LAS REFERENCIAS
===================================================== */

async function cargarTodasLasReferencias(){

  log(
    'Solicitando todas las referencias a Apps Script...'
  );


  const callback =
    'referencias_' +
    Date.now();


  return new Promise(
    function(resolve,reject){

      let terminado =
        false;


      const tiempoMaximo =
        setTimeout(
          function(){

            if(
              terminado
            ){

              return;

            }


            terminado =
              true;


            delete window[callback];


            reject(
              new Error(
                'Tiempo de espera agotado al cargar las referencias.'
              )
            );

          },
          60000
        );


      window[callback] =
      async function(respuesta){

        if(
          terminado
        ){

          return;

        }


        terminado =
          true;


        clearTimeout(
          tiempoMaximo
        );


        try{

          log(
            'RESPUESTA DE REFERENCIAS RECIBIDA'
          );


          if(
            !respuesta
          ){

            throw new Error(
              'Apps Script devolvió una respuesta vacía.'
            );

          }


          if(
            respuesta.ok === false
          ){

            throw new Error(
              respuesta.error ||
              'Apps Script devolvió un error.'
            );

          }


          if(
            !Array.isArray(
              respuesta.empleados
            )
          ){

            throw new Error(
              'No se recibió la lista de empleados.'
            );

          }


          log(
            'EMPLEADOS RECIBIDOS: ' +
            respuesta.empleados.length
          );


          empleados =
            [];


          descriptoresEmpleados =
            [];


          /* =============================================
             PROCESAR CADA EMPLEADO
          ============================================= */

          for(
            let i = 0;
            i < respuesta.empleados.length;
            i++
          ){

            const empleado =
              respuesta.empleados[i];


            log(
              'Procesando referencia ' +
              (i + 1) +
              '/' +
              respuesta.empleados.length
            );


            if(
              !empleado.base64
            ){

              log(
                'Referencia sin fotografía. Se omite.'
              );


              continue;

            }


            const img =
              await cargarImagenBase64(
                empleado.tipo,
                empleado.base64
              );


            const deteccion =
              await faceapi
              .detectSingleFace(
                img,
                new faceapi.TinyFaceDetectorOptions({

                  inputSize:
                    416,

                  scoreThreshold:
                    0.35

                })
              )
              .withFaceLandmarks()
              .withFaceDescriptor();


            if(
              !deteccion
            ){

              log(
                'No se encontró rostro en una referencia. Se omite.'
              );


              continue;

            }


            empleados.push({

              codigo:
                empleado.codigo,

              nombre:
                empleado.nombre,

              descriptor:
                deteccion.descriptor

            });


            descriptoresEmpleados.push({

              codigo:
                empleado.codigo,

              nombre:
                empleado.nombre,

              descriptor:
                deteccion.descriptor

            });


            log(
              'REFERENCIA FACIAL PROCESADA CORRECTAMENTE'
            );

          }


          if(
            descriptoresEmpleados.length === 0
          ){

            throw new Error(
              'No se pudo crear ningún descriptor facial.'
            );

          }


          log(
            '================================='
          );


          log(
            'DESCRIPTORES LISTOS: ' +
            descriptoresEmpleados.length
          );


          log(
            '================================='
          );


          resolve();

        }

        catch(error){

          reject(
            error
          );

        }

        finally{

          delete window[callback];

        }

      };


      const script =
        document.createElement(
          'script'
        );


      script.src =
        SCRIPT_URL +
        '?accion=obtenerTodasLasReferencias' +
        '&callback=' +
        encodeURIComponent(
          callback
        );


      script.onerror =
      function(){

        if(
          terminado
        ){

          return;

        }


        terminado =
          true;


        clearTimeout(
          tiempoMaximo
        );


        delete window[callback];


        reject(
          new Error(
            'No se pudo conectar con Apps Script al obtener las referencias.'
          )
        );

      };


      document.body.appendChild(
        script
      );

    }
  );

}


/* =====================================================
   CARGAR IMAGEN BASE64
===================================================== */

function cargarImagenBase64(
  tipo,
  base64
){

  return new Promise(
    function(resolve,reject){

      const img =
        new Image();


      img.onload =
      function(){

        resolve(
          img
        );

      };


      img.onerror =
      function(){

        reject(
          new Error(
            'No se pudo cargar una imagen de referencia.'
          )
        );

      };


      img.src =
        'data:' +
        (
          tipo ||
          'image/jpeg'
        ) +
        ';base64,' +
        base64;

    }
  );

}


/* =====================================================
   BOTÓN CÁMARA
===================================================== */

btnCamara.addEventListener(
  'click',
  iniciarCamara
);


/* =====================================================
   INICIAR CÁMARA
===================================================== */

async function iniciarCamara(){

  if(
    camaraActiva
  ){

    log(
      'La cámara ya está activa.'
    );


    return;

  }


  try{

    log(
      '================================='
    );


    log(
      'BOTÓN CÁMARA PRESIONADO'
    );


    estado.textContent =
      'Solicitando acceso a cámara...';


    if(
      !navigator.mediaDevices ||
      !navigator.mediaDevices.getUserMedia
    ){

      throw new Error(
        'El navegador no permite acceso a la cámara.'
      );

    }


    const stream =
      await navigator.mediaDevices
      .getUserMedia({

        video:{

          width:{
            ideal:640
          },

          height:{
            ideal:480
          },

          facingMode:
            'user'

        },

        audio:
          false

      });


    log(
      'CÁMARA OBTENIDA CORRECTAMENTE'
    );


    video.srcObject =
      stream;


    await new Promise(
      function(resolve){

        if(
          video.readyState >= 2
        ){

          resolve();

          return;

        }


        video.onloadedmetadata =
        function(){

          resolve();

        };

      }
    );


    await video.play();


    log(
      'VIDEO INICIADO'
    );


    log(
      'ANCHO VIDEO: ' +
      video.videoWidth
    );


    log(
      'ALTO VIDEO: ' +
      video.videoHeight
    );


    canvas.width =
      video.videoWidth;


    canvas.height =
      video.videoHeight;


    faceapi.matchDimensions(
      canvas,
      {

        width:
          video.videoWidth,

        height:
          video.videoHeight

      }
    );


    camaraActiva =
      true;


    btnCamara.disabled =
      true;


    estado.textContent =
      'Buscando rostro...';


    log(
      'CÁMARA ACTIVA'
    );


    iniciarDeteccion();

  }

  catch(error){

    console.error(
      'ERROR CÁMARA:',
      error
    );


    estado.textContent =
      'Error de cámara: ' +
      error.message;


    log(
      'ERROR CÁMARA: ' +
      error.message
    );

  }

}


/* =====================================================
   INICIAR DETECCIÓN
===================================================== */

function iniciarDeteccion(){

  if(
    analizando
  ){

    return;

  }


  analizando =
    true;


  log(
    'INICIANDO DETECCIÓN FACIAL'
  );


  log(
    'Se necesitan ' +
    COINCIDENCIAS_NECESARIAS +
    ' coincidencias consecutivas.'
  );


  detectar();

}


/* =====================================================
   DETECTAR ROSTRO
===================================================== */

async function detectar(){

  if(
    !camaraActiva ||
    descriptoresEmpleados.length === 0
  ){

    setTimeout(
      detectar,
      INTERVALO_DETECCION
    );


    return;

  }


  if(
    registroRealizado
  ){

    return;

  }


  try{

    totalDetecciones++;


    const detecciones =
      await faceapi
      .detectAllFaces(
        video,
        new faceapi.TinyFaceDetectorOptions({

          inputSize:
            416,

          scoreThreshold:
            0.30

        })
      )
      .withFaceLandmarks()
      .withFaceDescriptors();


    const resultados =
      faceapi.resizeResults(
        detecciones,
        {

          width:
            video.videoWidth,

          height:
            video.videoHeight

        }
      );


    const ctx =
      canvas.getContext(
        '2d'
      );


    ctx.clearRect(
      0,
      0,
      canvas.width,
      canvas.height
    );


    ultimoNumeroRostros =
      resultados.length;


    /* =================================================
       NINGÚN ROSTRO
    ================================================= */

    if(
      resultados.length === 0
    ){

      coincidenciasConsecutivas =
        0;


      ultimaDistancia =
        null;


      empleadoIdentificado =
        null;


      estado.textContent =
        'Buscando rostro...';


      log(
        'SIN ROSTRO - contador reiniciado'
      );

    }


    /* =================================================
       MÁS DE UN ROSTRO
    ================================================= */

    else if(
      resultados.length > 1
    ){

      coincidenciasConsecutivas =
        0;


      empleadoIdentificado =
        null;


      faceapi.draw.drawDetections(
        canvas,
        resultados
      );


      faceapi.draw.drawFaceLandmarks(
        canvas,
        resultados
      );


      estado.textContent =
        'Se detectaron varios rostros. Solo debe aparecer una persona.';


      log(
        'MÚLTIPLES ROSTROS DETECTADOS: ' +
        resultados.length
      );


      log(
        'REGISTRO BLOQUEADO POR SEGURIDAD'
      );

    }


    /* =================================================
       UN SOLO ROSTRO
    ================================================= */

    else{

      faceapi.draw.drawDetections(
        canvas,
        resultados
      );


      faceapi.draw.drawFaceLandmarks(
        canvas,
        resultados
      );


      log(
        'ROSTROS DETECTADOS: ' +
        resultados.length
      );


      const rostro =
        resultados[0];


      /**
       * =================================================
       * COMPARAR CONTRA TODOS
       * =================================================
       */

      let mejorCoincidencia =
        null;


      let menorDistancia =
        Infinity;


      for(
        let i = 0;
        i < descriptoresEmpleados.length;
        i++
      ){

        const referenciaEmpleado =
          descriptoresEmpleados[i];


        const distancia =
          faceapi.euclideanDistance(
            referenciaEmpleado.descriptor,
            rostro.descriptor
          );


        if(
          distancia <
          menorDistancia
        ){

          menorDistancia =
            distancia;


          mejorCoincidencia =
            referenciaEmpleado;

        }

      }


      ultimaDistancia =
        menorDistancia;


      log(
        'MEJOR DISTANCIA: ' +
        menorDistancia.toFixed(4)
      );


      /**
       * =================================================
       * COINCIDENCIA
       * =================================================
       */

      if(
        mejorCoincidencia &&
        menorDistancia <
        UMBRAL
      ){

        empleadoIdentificado =
          mejorCoincidencia;


        coincidenciasConsecutivas++;


        if(
          coincidenciasConsecutivas >
          COINCIDENCIAS_NECESARIAS
        ){

          coincidenciasConsecutivas =
            COINCIDENCIAS_NECESARIAS;

        }


        log(
          'COINCIDENCIA: SÍ'
        );


        log(
          'EMPLEADO IDENTIFICADO'
        );


        log(
          'PROGRESO: ' +
          coincidenciasConsecutivas +
          '/' +
          COINCIDENCIAS_NECESARIAS
        );


        estado.textContent =
          'Rostro identificado. Confirmando ' +
          coincidenciasConsecutivas +
          '/' +
          COINCIDENCIAS_NECESARIAS;


        /**
         * =================================================
         * IDENTIDAD CONFIRMADA
         * =================================================
         */

        if(
          coincidenciasConsecutivas >=
          COINCIDENCIAS_NECESARIAS
        ){

          if(
            !registroRealizado &&
            !enviandoRegistro
          ){

            registroRealizado =
              true;


            ultimoRostro =
              Date.now();


            log(
              '================================='
            );


            log(
              '3 COINCIDENCIAS CONSECUTIVAS'
            );


            log(
              'IDENTIDAD CONFIRMADA'
            );


            log(
              '================================='
            );


            await registrarAsistencia();

          }

        }

      }


      /* =================================================
         NO COINCIDE
      ================================================= */

      else{

        coincidenciasConsecutivas =
          0;


        empleadoIdentificado =
          null;


        log(
          'COINCIDENCIA: NO'
        );


        log(
          'CONTADOR REINICIADO: 0/' +
          COINCIDENCIAS_NECESARIAS
        );


        estado.textContent =
          'Rostro detectado, pero no coincide.';

      }

    }

  }

  catch(error){

    console.error(
      'ERROR DETECCIÓN:',
      error
    );


    log(
      'ERROR DETECCIÓN: ' +
      error.message
    );

  }


  if(
    !registroRealizado
  ){

    setTimeout(
      detectar,
      INTERVALO_DETECCION
    );

  }

}


/* =====================================================
   REGISTRAR ASISTENCIA
===================================================== */

async function registrarAsistencia(){

  if(
    enviandoRegistro
  ){

    log(
      'REGISTRO YA EN PROCESO. SOLICITUD IGNORADA.'
    );


    return;

  }


  if(
    !empleadoIdentificado
  ){

    registroRealizado =
      false;


    return;

  }


  enviandoRegistro =
    true;


  try{

    estado.textContent =
      'Identidad confirmada. Capturando fotografía...';


    log(
      'CAPTURANDO FOTOGRAFÍA...'
    );


    const tempCanvas =
      document.createElement(
        'canvas'
      );


    tempCanvas.width =
      video.videoWidth;


    tempCanvas.height =
      video.videoHeight;


    const ctx =
      tempCanvas.getContext(
        '2d'
      );


    ctx.drawImage(
      video,
      0,
      0,
      video.videoWidth,
      video.videoHeight
    );


    const foto =
      tempCanvas.toDataURL(
        'image/jpeg',
        0.85
      );


    log(
      'FOTOGRAFÍA CAPTURADA'
    );


    log(
      'TAMAÑO FOTO: ' +
      foto.length +
      ' caracteres'
    );


    estado.textContent =
      'Obteniendo ubicación GPS...';


    if(
      !navigator.geolocation
    ){

      log(
        'GPS NO DISPONIBLE'
      );


      await enviarRegistro({

        empleado:
          empleadoIdentificado.nombre,

        foto:
          foto,

        observacion:
          'Registro biométrico automático - GPS no disponible'

      });


      return;

    }


    navigator.geolocation.getCurrentPosition(

      async function(pos){

        log(
          'GPS OBTENIDO'
        );


        log(
          'LATITUD: ' +
          pos.coords.latitude
        );


        log(
          'LONGITUD: ' +
          pos.coords.longitude
        );


        const datos =
        {

          empleado:
            empleadoIdentificado.nombre,

          foto:
            foto,

          lat:
            pos.coords.latitude,

          lng:
            pos.coords.longitude,

          observacion:
            'Registro biométrico automático'

        };


        await enviarRegistro(
          datos
        );

      },


      async function(error){

        log(
          'GPS NO DISPONIBLE: ' +
          error.message
        );


        const datos =
        {

          empleado:
            empleadoIdentificado.nombre,

          foto:
            foto,

          observacion:
            'Registro biométrico automático - GPS no disponible'

        };


        await enviarRegistro(
          datos
        );

      },


      {

        enableHighAccuracy:
          true,

        timeout:
          10000,

        maximumAge:
          0

      }

    );

  }

  catch(error){

    registroRealizado =
      false;


    enviandoRegistro =
      false;


    estado.textContent =
      'Error: ' +
      error.message;


    log(
      'ERROR REGISTRANDO: ' +
      error.message
    );

  }

}


/* =====================================================
   ENVIAR REGISTRO
   POST + IFRAME
===================================================== */

function enviarRegistro(
  datos
){

  return new Promise(
    function(resolve){

      log(
        '================================='
      );


      log(
        'MÉTODO: POST'
      );


      log(
        'ENVIANDO REGISTRO A APPS SCRIPT...'
      );


      estado.textContent =
        'Registrando asistencia...';


      const iframeName =
        'iframeRegistro_' +
        Date.now();


      const iframe =
        document.createElement(
          'iframe'
        );


      iframe.name =
        iframeName;


      iframe.id =
        iframeName;


      iframe.style.display =
        'none';


      document.body.appendChild(
        iframe
      );


      const formulario =
        document.createElement(
          'form'
        );


      formulario.method =
        'POST';


      formulario.action =
        SCRIPT_URL;


      formulario.target =
        iframeName;


      formulario.style.display =
        'none';


      let datosJSON;


      try{

        datosJSON =
          JSON.stringify(
            datos
          );

      }

      catch(error){

        log(
          'ERROR CONVIRTIENDO DATOS A JSON: ' +
          error.message
        );


        estado.textContent =
          'Error preparando el registro.';


        enviandoRegistro =
          false;


        registroRealizado =
          false;


        iframe.remove();


        resolve();


        return;

      }


      log(
        'DATOS PREPARADOS CORRECTAMENTE'
      );


      log(
        'EMPLEADO IDENTIFICADO CORRECTAMENTE'
      );


      log(
        'FOTO: ' +
        (
          datos.foto
            ? datos.foto.length
            : 0
        ) +
        ' caracteres'
      );


      if(
        datos.lat !== undefined &&
        datos.lng !== undefined
      ){

        log(
          'GPS: ' +
          datos.lat +
          ', ' +
          datos.lng
        );

      }

      else{

        log(
          'GPS: NO DISPONIBLE'
        );

      }


      const campoDatos =
        document.createElement(
          'input'
        );


      campoDatos.type =
        'hidden';


      campoDatos.name =
        'datos';


      campoDatos.value =
        datosJSON;


      formulario.appendChild(
        campoDatos
      );


      document.body.appendChild(
        formulario
      );


      let terminado =
        false;


      const tiempoMaximo =
        setTimeout(
          function(){

            if(
              terminado
            ){

              return;

            }


            terminado =
              true;


            estado.textContent =
              'Tiempo de espera agotado al registrar.';


            log(
              'TIMEOUT ESPERANDO RESPUESTA DE APPS SCRIPT'
            );


            registroRealizado =
              false;


            enviandoRegistro =
              false;


            try{

              formulario.remove();

            }

            catch(error){}


            try{

              iframe.remove();

            }

            catch(error){}


            resolve();

          },
          30000
        );


      iframe.onload =
      function(){

        if(
          terminado
        ){

          return;

        }


        terminado =
          true;


        clearTimeout(
          tiempoMaximo
        );


        log(
          'RESPUESTA DEL POST RECIBIDA'
        );


        estado.textContent =
          'Asistencia registrada correctamente.';


        log(
          '================================='
        );


        log(
          'POST COMPLETADO'
        );


        log(
          'REGISTRO ENVIADO A APPS SCRIPT'
        );


        log(
          '================================='
        );


        enviandoRegistro =
          false;


        setTimeout(
          function(){

            try{

              formulario.remove();

            }

            catch(error){}


            try{

              iframe.remove();

            }

            catch(error){}

          },
          1500
        );


        resolve();

      };


      iframe.onerror =
      function(){

        if(
          terminado
        ){

          return;

        }


        terminado =
          true;


        clearTimeout(
          tiempoMaximo
        );


        registroRealizado =
          false;


        enviandoRegistro =
          false;


        estado.textContent =
          'Error enviando asistencia.';


        log(
          'ERROR CARGANDO RESPUESTA DE APPS SCRIPT'
        );


        try{

          formulario.remove();

        }

        catch(error){}


        try{

          iframe.remove();

        }

        catch(error){}


        resolve();

      };


      log(
        'ENVIANDO POST...'
      );


      try{

        formulario.submit();


        log(
          'POST ENVIADO CORRECTAMENTE'
        );

      }

      catch(error){

        terminado =
          true;


        clearTimeout(
          tiempoMaximo
        );


        registroRealizado =
          false;


        enviandoRegistro =
          false;


        estado.textContent =
          'Error enviando asistencia: ' +
          error.message;


        log(
          'ERROR AL EJECUTAR POST: ' +
          error.message
        );


        try{

          formulario.remove();

        }

        catch(error){}


        try{

          iframe.remove();

        }

        catch(error){}


        resolve();

      }

    }
  );

}


/* =====================================================
   ARRANCAR
===================================================== */

window.addEventListener(
  'load',
  function(){

    btnCamara.disabled =
      true;


    iniciarSistema();

  }
);

</script>
