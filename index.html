<style>

   CONFIGURACIÓN GENERAL

  font-family:Arial,Helvetica,sans-serif;

/* =====================================================
   LOGOS
===================================================== */

  width:110px;

  height:110px;

  object-fit:contain;

  background:white;

  padding:8px;

  border-radius:12px;

  box-shadow:
    0 3px 10px

}


/* =====================================================
   TITULO CENTRAL
===================================================== */

.titulo{

  flex:1;

  text-align:center;

}


.titulo h1{

  margin:0;

  font-size:30px;

  color:#111827;

}


.titulo p{

  margin:7px 0 0 0;

  color:#4b5563;

  font-size:16px;

}


/* =====================================================
   ESTADO
===================================================== */

#estado{

  font-size:18px;

  font-weight:bold;

  margin:15px auto;

  max-width:700px;

  min-height:28px;

  color:#111827;

}


/* =====================================================
   REFERENCIA
===================================================== */

#referencia{

  margin:10px auto;

  padding:10px;

  background:#dcfce7;

  color:#166534;

  border-radius:10px;

  max-width:500px;

  font-weight:bold;

}


/* =====================================================
   CONTENEDOR DE CÁMARA
===================================================== */

#contenedor{

  position:relative;

  width:640px;

  max-width:95%;

  margin:20px auto;

}


/* =====================================================
   VIDEO
===================================================== */

#video{

  width:100%;

  display:block;

  border-radius:15px;

  border:4px solid #2563eb;

  background:#000;

}


/* =====================================================
   OVERLAY
===================================================== */

#overlay{

  position:absolute;

  left:0;

  top:0;

  width:100%;

  height:100%;

  pointer-events:none;

}


/* =====================================================
   BOTÓN
===================================================== */

button{

  padding:14px 25px;

  border:0;

  border-radius:10px;

  background:#2563eb;

  color:white;

  font-size:17px;

  font-weight:bold;

  cursor:pointer;

  min-width:220px;

  box-shadow:
    0 3px 8px
    rgba(0,0,0,0.15);

}


button:hover{

  background:#1d4ed8;

}


button:disabled{

  background:#9ca3af;

  cursor:not-allowed;

}


/* =====================================================
   DIAGNÓSTICO OCULTO
=====================================================

   El diagnóstico permanece disponible para nosotros
   mediante la consola del navegador, pero NO aparece
   en la página para los empleados.

===================================================== */

#diagnostico{

  display:none;

}


/* =====================================================
   RESPONSIVE
===================================================== */

@media(max-width:700px){

  body{

    padding:12px;

  }


  .encabezado{

    gap:8px;

  }


  .logo{

    width:75px;

    height:75px;

    padding:5px;

  }


  .titulo h1{

    font-size:21px;

  }


  .titulo p{

    font-size:12px;

  }


  #contenedor{

    max-width:100%;

  }


  button{

    width:90%;

    max-width:300px;

  }

}

</style>

</head>


<body>


<!-- =====================================================
     ENCABEZADO CON LOGOS
===================================================== -->

<div class="encabezado">


  <!-- LOGO INSTITUCIONAL -->

  <img
    class="logo"
    src="https://drive.google.com/thumbnail?id=1GuC8MKZDc0IE4-mXLd8kQ8P53CeIOZ1B&sz=w400"
    alt="Logo institucional"
  >


  <!-- TITULO -->

  <div class="titulo">

    <h1>
      AsistenciaFace
    </h1>

    <p>
      Sistema biométrico de control de asistencia
    </p>

  </div>


  <!-- LOGO DE LA DIVISIÓN -->

  <img
    class="logo"
    src="https://drive.google.com/thumbnail?id=1LqKPJJBgkjUuYhLewDDrr2ad813w9ngO&sz=w400"
    alt="Logo de la división"
  >


</div>


<!-- =====================================================
     REFERENCIA
===================================================== -->

<div id="referencia">

  Cargando referencia facial...

</div>


<!-- =====================================================
     ESTADO
===================================================== -->

<div id="estado">

  Inicializando sistema...

</div>


<!-- =====================================================
     CÁMARA
===================================================== -->

<div id="contenedor">

  <video
    id="video"
    autoplay
    muted

  </video>

  <canvas

  </canvas>

<!-- =====================================================
     BOTÓN
===================================================== -->

<button
  id="btnCamara"

  Iniciar cámara

</button>


<!-- =====================================================
     DIAGNÓSTICO
     
     Está oculto visualmente.
     Los mensajes siguen apareciendo en la consola.
===================================================== -->

<div id="diagnostico">

  INICIANDO DIAGNÓSTICO...

</div>



<script>

'use strict';


/* =====================================================
   CONFIGURACIÓN
===================================================== */

const SCRIPT_URL =
'https://script.google.com/macros/s/AKfycbwSnVCHj2qiKd9JfCembdLIJ8bFuFYQBJ-2D4xE25i0PHhJKDdOuAdps4aa3a5-E9sy/exec';


const CODIGO_EMPLEADO =
'EMP001';


/*
 * Distancia máxima permitida.
 *
 * Menor distancia = mayor similitud.
 */

const UMBRAL =
0.60;


/*
 * Número de coincidencias consecutivas
 * necesarias antes de registrar.
 */

const COINCIDENCIAS_NECESARIAS =
3;


/*
 * Intervalo entre análisis.
 */

const INTERVALO_DETECCION =
500;


/*
 * URL de modelos Face API.
 */

const MODELOS_URL =
'https://cdn.jsdelivr.net/gh/justadudewhohacks/face-api.js@0.22.2/weights';


/* =====================================================
   ELEMENTOS HTML
===================================================== */

const video =
document.getElementById('video');


const canvas =
document.getElementById('overlay');


const estado =
document.getElementById('estado');


const referencia =
document.getElementById('referencia');


const diagnostico =
document.getElementById('diagnostico');


const btnCamara =
document.getElementById('btnCamara');


/* =====================================================
   VARIABLES DEL SISTEMA
===================================================== */

let descriptorReferencia =
null;


let nombreEmpleado =
'';


let camaraActiva =
false;


let analizando =
false;


/*
 * Bloqueo principal.
 *
 * Cuando pasa a true, no se permite
 * otro registro durante esta sesión.
 */

let registroRealizado =
false;


/*
 * Bloqueo adicional para impedir
 * dos envíos simultáneos.
 */

let enviandoRegistro =
false;


/*
 * Contador de coincidencias consecutivas.
 */

let coincidenciasConsecutivas =
0;


/*
 * Última distancia detectada.
 */

let ultimaDistancia =
null;


/*
 * Número de detecciones realizadas.
 */

let totalDetecciones =
0;


/*
 * Número de rostros detectados.
 */

let ultimoNumeroRostros =
0;


/*
 * Hora de la última coincidencia.
 */

let ultimoRostro =
0;


/* =====================================================
   FUNCIÓN DE DIAGNÓSTICO
===================================================== */

function log(mensaje){

  console.log(
    mensaje
  );


  if(
    diagnostico
  ){

    diagnostico.innerHTML +=
      '<br>' +
      mensaje;

  }

}


/* =====================================================
   DIAGNÓSTICO LIMPIO
===================================================== */

function limpiarDiagnostico(){

  if(
    diagnostico
  ){

    diagnostico.innerHTML =
      'DIAGNÓSTICO DEL SISTEMA';

  }

}


/* =====================================================
   INICIO DEL SISTEMA
===================================================== */

async function iniciarSistema(){

  try{

    limpiarDiagnostico();


    estado.textContent =
      'Inicializando sistema...';


    log(
      '================================='
    );


    log(
      'INICIO ASISTENCIA FACE'
    );


    log(
      '================================='
    );


    log(
      'URL APPS SCRIPT:'
    );


    log(
      SCRIPT_URL
    );


    log(
      'CÓDIGO EMPLEADO: ' +
      CODIGO_EMPLEADO
    );


    log(
      'UMBRAL FACIAL: ' +
      UMBRAL
    );


    log(
      'COINCIDENCIAS NECESARIAS: ' +
      COINCIDENCIAS_NECESARIAS
    );


    /* =================================================
       TINY FACE DETECTOR
    ================================================= */

    estado.textContent =
      'Cargando detector facial...';


    log(
      'Cargando TinyFaceDetector...'
    );


    await faceapi.nets.tinyFaceDetector
      .loadFromUri(
        MODELOS_URL
      );


    log(
      'TinyFaceDetector OK'
    );


    /* =================================================
       LANDMARKS
    ================================================= */

    log(
      'Cargando FaceLandmark68...'
    );


    await faceapi.nets.faceLandmark68Net
      .loadFromUri(
        MODELOS_URL
      );


    log(
      'FaceLandmark68 OK'
    );


    /* =================================================
       FACE RECOGNITION
    ================================================= */

    log(
      'Cargando FaceRecognition...'
    );


    await faceapi.nets.faceRecognitionNet
      .loadFromUri(
        MODELOS_URL
      );


    log(
      'FaceRecognition OK'
    );


    log(
      'TODOS LOS MODELOS FACIALES CARGADOS'
    );


    /* =================================================
       REFERENCIA
    ================================================= */

    estado.textContent =
      'Cargando referencia facial...';


    await cargarReferencia();


    estado.textContent =
      'Referencia cargada. Pulsa Iniciar cámara.';


    referencia.textContent =
      'Referencia facial cargada: ' +
      nombreEmpleado;


    btnCamara.disabled =
      false;


    log(
      '================================='
    );


    log(
      'SISTEMA LISTO'
    );


    log(
      'Pulsa "Iniciar cámara"'
    );


    log(
      '================================='

    );

  }

  catch(error){

    console.error(
      'ERROR INICIANDO SISTEMA:',
      error
    );


    estado.textContent =
      'ERROR: ' +
      error.message;


    log(
      '================================='
    );


    log(
      'ERROR DE INICIALIZACIÓN'
    );


    log(
      error.message
    );


    log(
      '================================='
    );

  }

}


/* =====================================================
   CARGAR REFERENCIA
===================================================== */

async function cargarReferencia(){

  log(
    'Solicitando fotografía a Apps Script...'
  );


  const callback =
    'referencia_' +
    Date.now();


  return new Promise(
    function(resolve,reject){

      let terminado =
        false;


      const tiempoMaximo =
        setTimeout(
          function(){

            if(
              terminado
            ){

              return;

            }


            terminado =
              true;


            delete window[callback];


            reject(
              new Error(
                'Tiempo de espera agotado al conectar con Apps Script.'
              )
            );

          },
          30000
        );


      window[callback] =
      function(respuesta){

        if(
          terminado
        ){

          return;

        }


        terminado =
          true;


        clearTimeout(
          tiempoMaximo
        );


        try{

          log(
            'RESPUESTA DE REFERENCIA RECIBIDA'
          );


          if(
            !respuesta
          ){

            throw new Error(
              'Apps Script devolvió una respuesta vacía.'
            );

          }


          if(
            respuesta.ok === false
          ){

            throw new Error(
              respuesta.error ||
              'Apps Script devolvió un error.'
            );

          }


          nombreEmpleado =
            respuesta.nombre ||
            CODIGO_EMPLEADO;


          log(
            'EMPLEADO: ' +
            nombreEmpleado
          );


          if(
            !respuesta.base64
          ){

            throw new Error(
              'No se recibió la fotografía Base64.'
            );

          }


          log(
            'BASE64 RECIBIDO: ' +
            respuesta.base64.length +
            ' caracteres'
          );


          const img =
            new Image();


          img.onload =
          async function(){

            try{

              log(
                'IMAGEN DE REFERENCIA CARGADA'
              );


              const deteccion =
                await faceapi
                .detectSingleFace(
                  img,
                  new faceapi.TinyFaceDetectorOptions({

                    inputSize:
                      416,

                    scoreThreshold:
                      0.35

                  })
                )
                .withFaceLandmarks()
                .withFaceDescriptor();


              if(
                !deteccion
              ){

                throw new Error(
                  'No se encontró rostro en la foto de referencia.'
                );

              }


              descriptorReferencia =
                deteccion.descriptor;


              log(
                'DESCRIPTOR DE REFERENCIA CREADO'
              );


              log(
                'DIMENSIÓN: ' +
                descriptorReferencia.length
              );


              log(
                'REFERENCIA FACIAL OK'
              );


              resolve();

            }

            catch(error){

              reject(
                error
              );

            }

          };


          img.onerror =
          function(){

            reject(
              new Error(
                'No se pudo cargar la imagen de referencia.'
              )
            );

          };


          img.src =
            'data:' +
            respuesta.tipo +
            ';base64,' +
            respuesta.base64;

        }

        catch(error){

          reject(
            error
          );

        }

        finally{

          delete window[callback];

        }

      };


      const script =
        document.createElement(
          'script'
        );


      script.src =
        SCRIPT_URL +
        '?accion=obtenerReferencia' +
        '&codigo=' +
        encodeURIComponent(
          CODIGO_EMPLEADO
        ) +
        '&callback=' +
        encodeURIComponent(
          callback
        );


      script.onerror =
      function(){

        if(
          terminado
        ){

          return;

        }


        terminado =
          true;


        clearTimeout(
          tiempoMaximo
        );


        delete window[callback];


        reject(
          new Error(
            'No se pudo conectar con Apps Script al obtener la referencia.'
          )
        );

      };


      document.body.appendChild(
        script
      );

    }
  );

}


/* =====================================================
   BOTÓN CÁMARA
===================================================== */

btnCamara.addEventListener(
  'click',
  iniciarCamara
);


/* =====================================================
   INICIAR CÁMARA
===================================================== */

async function iniciarCamara(){

  if(
    camaraActiva
  ){

    log(
      'La cámara ya está activa.'
    );


    return;

  }


  try{

    log(
      '================================='
    );


    log(
      'BOTÓN CÁMARA PRESIONADO'
    );


    estado.textContent =
      'Solicitando acceso a cámara...';


    if(
      !navigator.mediaDevices ||
      !navigator.mediaDevices.getUserMedia
    ){

      throw new Error(
        'El navegador no permite acceso a la cámara.'
      );

    }


    const stream =
      await navigator.mediaDevices
      .getUserMedia({

        video:{

          width:{
            ideal:640
          },

          height:{
            ideal:480
          },

          facingMode:
            'user'

        },

        audio:
          false

      });


    log(
      'CÁMARA OBTENIDA CORRECTAMENTE'
    );


    video.srcObject =
      stream;


    await new Promise(
      function(resolve){

        if(
          video.readyState >= 2
        ){

          resolve();

          return;

        }


        video.onloadedmetadata =
        function(){

          resolve();

        };

      }
    );


    await video.play();


    log(
      'VIDEO INICIADO'
    );


    log(
      'ANCHO VIDEO: ' +
      video.videoWidth
    );


    log(
      'ALTO VIDEO: ' +
      video.videoHeight
    );


    canvas.width =
      video.videoWidth;


    canvas.height =
      video.videoHeight;


    faceapi.matchDimensions(
      canvas,
      {
        width:
          video.videoWidth,

        height:
          video.videoHeight
      }
    );


    camaraActiva =
      true;


    btnCamara.disabled =
      true;


    estado.textContent =
      'Buscando rostro...';


    log(
      'CÁMARA ACTIVA'
    );


    iniciarDeteccion();

  }

  catch(error){

    console.error(
      'ERROR CÁMARA:',
      error
    );


    estado.textContent =
      'Error de cámara: ' +
      error.message;


    log(
      'ERROR CÁMARA: ' +
      error.message
    );

  }

}


/* =====================================================
   INICIAR DETECCIÓN
===================================================== */

function iniciarDeteccion(){

  if(
    analizando
  ){

    return;

  }


  analizando =
    true;


  log(
    'INICIANDO DETECCIÓN FACIAL'
  );


  log(
    'Se necesitan ' +
    COINCIDENCIAS_NECESARIAS +
    ' coincidencias consecutivas.'
  );


  detectar();

}


/* =====================================================
   DETECTAR ROSTRO
===================================================== */

async function detectar(){

  if(
    !camaraActiva ||
    !descriptorReferencia
  ){

    setTimeout(
      detectar,
      INTERVALO_DETECCION
    );


    return;

  }


  if(
    registroRealizado
  ){

    return;

  }


  try{

    totalDetecciones++;


    const detecciones =
      await faceapi
      .detectAllFaces(
        video,
        new faceapi.TinyFaceDetectorOptions({

          inputSize:
            416,

          scoreThreshold:
            0.30

        })
      )
      .withFaceLandmarks()
      .withFaceDescriptors();


    const resultados =
      faceapi.resizeResults(
        detecciones,
        {

          width:
            video.videoWidth,

          height:
            video.videoHeight

        }
      );


    const ctx =
      canvas.getContext(
        '2d'
      );


    ctx.clearRect(
      0,
      0,
      canvas.width,
      canvas.height
    );


    ultimoNumeroRostros =
      resultados.length;


    /* =================================================
       SIN ROSTRO
    ================================================= */

    if(
      resultados.length === 0
    ){

      coincidenciasConsecutivas =
        0;


      ultimaDistancia =
        null;


      estado.textContent =
        'Buscando rostro...';


      log(
        'SIN ROSTRO - contador reiniciado'
      );

    }


    /* =================================================
       UNO O MÁS ROSTROS
    ================================================= */

    else{

      faceapi.draw.drawDetections(
        canvas,
        resultados
      );


      faceapi.draw.drawFaceLandmarks(
        canvas,
        resultados
      );


      log(
        'ROSTROS DETECTADOS: ' +
        resultados.length
      );


      const rostro =
        resultados[0];


      const distancia =
        faceapi.euclideanDistance(
          descriptorReferencia,
          rostro.descriptor
        );


      ultimaDistancia =
        distancia;


      log(
        'DISTANCIA: ' +
        distancia.toFixed(4)
      );


      /* =================================================
         COINCIDENCIA
      ================================================= */

      if(
        distancia <
        UMBRAL
      ){

        coincidenciasConsecutivas++;


        if(
          coincidenciasConsecutivas >
          COINCIDENCIAS_NECESARIAS
        ){

          coincidenciasConsecutivas =
            COINCIDENCIAS_NECESARIAS;

        }


        log(
          'COINCIDENCIA: SÍ'
        );


        log(
          'PROGRESO: ' +
          coincidenciasConsecutivas +
          '/' +
          COINCIDENCIAS_NECESARIAS
        );


        estado.textContent =
          'Rostro coincidente ' +
          coincidenciasConsecutivas +
          '/' +
          COINCIDENCIAS_NECESARIAS;


        if(
          coincidenciasConsecutivas >=
          COINCIDENCIAS_NECESARIAS
        ){

          if(
            !registroRealizado &&
            !enviandoRegistro
          ){

            registroRealizado =
              true;


            ultimoRostro =
              Date.now();


            log(
              '================================='
            );


            log(
              '3 COINCIDENCIAS CONSECUTIVAS'
            );


            log(
              'IDENTIDAD CONFIRMADA'
            );


            log(
              '================================='
            );


            await registrarAsistencia();

          }

        }

      }

      /* =================================================
         NO COINCIDE
      ================================================= */

      else{

        coincidenciasConsecutivas =
          0;


        log(
          'COINCIDENCIA: NO'
        );


        log(
          'CONTADOR REINICIADO: 0/' +
          COINCIDENCIAS_NECESARIAS
        );


        estado.textContent =
          'Rostro detectado, pero no coincide.';

      }

    }

  }

  catch(error){

    console.error(
      'ERROR DETECCIÓN:',
      error
    );


    log(
      'ERROR DETECCIÓN: ' +
      error.message
    );

  }


  if(
    !registroRealizado
  ){

    setTimeout(
      detectar,
      INTERVALO_DETECCION
    );

  }

}


/* =====================================================
   REGISTRAR ASISTENCIA
===================================================== */

async function registrarAsistencia(){

  if(
    enviandoRegistro
  ){

    log(
      'REGISTRO YA EN PROCESO. SOLICITUD IGNORADA.'
    );


    return;

  }


  enviandoRegistro =
    true;


  try{

    estado.textContent =
      'Identidad confirmada. Capturando fotografía...';


    log(
      'CAPTURANDO FOTOGRAFÍA...'
    );


    const tempCanvas =
      document.createElement(
        'canvas'
      );


    tempCanvas.width =
      video.videoWidth;


    tempCanvas.height =
      video.videoHeight;


    const ctx =
      tempCanvas.getContext(
        '2d'
      );


    ctx.drawImage(
      video,
      0,
      0,
      video.videoWidth,
      video.videoHeight
    );


    const foto =
      tempCanvas.toDataURL(
        'image/jpeg',
        0.85
      );


    log(
      'FOTOGRAFÍA CAPTURADA'
    );


    log(
      'TAMAÑO FOTO: ' +
      foto.length +
      ' caracteres'
    );


    estado.textContent =
      'Obteniendo ubicación GPS...';


    /* =================================================
       GPS
    ================================================= */

    if(
      !navigator.geolocation
    ){

      log(
        'GPS NO DISPONIBLE'
      );


      await enviarRegistro({

        empleado:
          nombreEmpleado,

        foto:
          foto,

        observacion:
          'Registro biométrico automático - GPS no disponible'

      });


      return;

    }


    navigator.geolocation.getCurrentPosition(

      async function(pos){

        log(
          'GPS OBTENIDO'
        );


        log(
          'LATITUD: ' +
          pos.coords.latitude
        );


        log(
          'LONGITUD: ' +
          pos.coords.longitude
        );


        const datos =
        {

          empleado:
            nombreEmpleado,

          foto:
            foto,

          lat:
            pos.coords.latitude,

          lng:
            pos.coords.longitude,

          observacion:
            'Registro biométrico automático'

        };


        await enviarRegistro(
          datos
        );

      },

      async function(error){

        log(
          'GPS NO DISPONIBLE: ' +
          error.message
        );


        const datos =
        {

          empleado:
            nombreEmpleado,

          foto:
            foto,

          observacion:
            'Registro biométrico automático - GPS no disponible'

        };


        await enviarRegistro(
          datos
        );

      },

      {

        enableHighAccuracy:
          true,

        timeout:
          10000,

        maximumAge:
          0

      }

    );

  }

  catch(error){

    registroRealizado =
      false;


    enviandoRegistro =
      false;


    estado.textContent =
      'Error: ' +
      error.message;


    log(
      'ERROR REGISTRANDO: ' +
      error.message
    );

  }

}


/* =====================================================
   ENVIAR REGISTRO A APPS SCRIPT
   POST + IFRAME
===================================================== */

function enviarRegistro(datos){

  return new Promise(
    function(resolve){

      log(
        '================================='
      );


      log(
        'MÉTODO: POST'
      );


      log(
        'ENVIANDO REGISTRO A APPS SCRIPT...'
      );


      estado.textContent =
        'Registrando asistencia...';


      /* =================================================
         IFRAME
      ================================================= */

      const iframeName =
        'iframeRegistro_' +
        Date.now();


      const iframe =
        document.createElement(
          'iframe'
        );


      iframe.name =
        iframeName;


      iframe.id =
        iframeName;


      iframe.style.display =
        'none';


      document.body.appendChild(
        iframe
      );


      /* =================================================
         FORMULARIO
      ================================================= */

      const formulario =
        document.createElement(
          'form'
        );


      formulario.method =
        'POST';


      formulario.action =
        SCRIPT_URL;


      formulario.target =
        iframeName;


      formulario.style.display =
        'none';


      /* =================================================
         JSON
      ================================================= */

      let datosJSON;


      try{

        datosJSON =
          JSON.stringify(
            datos
          );

      }

      catch(error){

        log(
          'ERROR CONVIRTIENDO DATOS A JSON: ' +
          error.message
        );


        estado.textContent =
          'Error preparando el registro.';


        enviandoRegistro =
          false;


        registroRealizado =
          false;


        iframe.remove();


        resolve();


        return;

      }


      log(
        'DATOS PREPARADOS CORRECTAMENTE'
      );


      log(
        'EMPLEADO: ' +
        datos.empleado
      );


      log(
        'FOTO: ' +
        (
          datos.foto
            ? datos.foto.length
            : 0
        ) +
        ' caracteres'
      );


      if(
        datos.lat !== undefined &&
        datos.lng !== undefined
      ){

        log(
          'GPS: ' +
          datos.lat +
          ', ' +
          datos.lng
        );

      }

      else{

        log(
          'GPS: NO DISPONIBLE'
        );

      }


      /* =================================================
         CAMPO DATOS
      ================================================= */

      const campoDatos =
        document.createElement(
          'input'
        );


      campoDatos.type =
        'hidden';


      campoDatos.name =
        'datos';


      campoDatos.value =
        datosJSON;


      formulario.appendChild(
        campoDatos
      );


      document.body.appendChild(
        formulario
      );


      /* =================================================
         CONTROL DE TIEMPO
      ================================================= */

      let terminado =
        false;


      const tiempoMaximo =
        setTimeout(
          function(){

            if(
              terminado
            ){

              return;

            }


            terminado =
              true;


            estado.textContent =
              'Tiempo de espera agotado al registrar.';


            log(
              'TIMEOUT ESPERANDO RESPUESTA DE APPS SCRIPT'
            );


            registroRealizado =
              false;


            enviandoRegistro =
              false;


            try{

              formulario.remove();

            }

            catch(error){}


            try{

              iframe.remove();

            }

            catch(error){}


            resolve();

          },
          30000
        );


      /* =================================================
         RESPUESTA
      ================================================= */

      iframe.onload =
      function(){

        if(
          terminado
        ){

          return;

        }


        terminado =
          true;


        clearTimeout(
          tiempoMaximo
        );


        log(
          'RESPUESTA DEL POST RECIBIDA'
        );


        estado.textContent =
          'Asistencia registrada correctamente.';


        log(
          '================================='
        );


        log(
          'POST COMPLETADO'
        );


        log(
          'REGISTRO ENVIADO A APPS SCRIPT'
        );


        log(
          '================================='
        );


        /*
         * NO liberamos registroRealizado.
         *
         * De esta manera no puede volver
         * a registrarse otra asistencia
         * durante esta sesión.
         */

        enviandoRegistro =
          false;


        setTimeout(
          function(){

            try{

              formulario.remove();

            }

            catch(error){}


            try{

              iframe.remove();

            }

            catch(error){}

          },
          1500
        );


        resolve();

      };


      /* =================================================
         ERROR IFRAME
      ================================================= */

      iframe.onerror =
      function(){

        if(
          terminado
        ){

          return;

        }


        terminado =
          true;


        clearTimeout(
          tiempoMaximo
        );


        registroRealizado =
          false;


        enviandoRegistro =
          false;


        estado.textContent =
          'Error enviando asistencia.';


        log(
          'ERROR CARGANDO RESPUESTA DE APPS SCRIPT'
        );


        try{

          formulario.remove();

        }

        catch(error){}


        try{

          iframe.remove();

        }

        catch(error){}


        resolve();

      };


      /* =================================================
         ENVIAR POST
      ================================================= */

      log(
        'ENVIANDO POST...'
      );


      try{

        formulario.submit();


        log(
          'POST ENVIADO CORRECTAMENTE'
        );

      }

      catch(error){

        terminado =
          true;


        clearTimeout(
          tiempoMaximo
        );


        registroRealizado =
          false;


        enviandoRegistro =
          false;


        estado.textContent =
          'Error enviando asistencia: ' +
          error.message;


        log(
          'ERROR AL EJECUTAR POST: ' +
          error.message
        );


        try{

          formulario.remove();

        }

        catch(error){}


        try{

          iframe.remove();

        }

        catch(error){}


        resolve();

      }

    }
  );

}


/* =====================================================
   ARRANCAR
===================================================== */

window.addEventListener(
  'load',
  function(){

    btnCamara.disabled =
      true;


    iniciarSistema();

  }
);

</script>
