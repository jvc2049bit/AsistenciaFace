<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>AsistenciaFace</title>

<script src="https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/dist/face-api.min.js"></script>

<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  padding:20px;
  font-family:Arial,Helvetica,sans-serif;
  background:#f3f4f6;
  text-align:center;
}

h1{
  margin:10px 0 5px;
}

#estado{
  font-size:18px;
  font-weight:bold;
  margin:15px auto;
  max-width:700px;
}

#referencia{
  margin:10px auto;
  padding:10px;
  background:#dcfce7;
  color:#166534;
  border-radius:10px;
  max-width:500px;
  font-weight:bold;
}

#contenedor{
  position:relative;
  width:640px;
  max-width:95%;
  margin:20px auto;
}

#video{
  width:100%;
  display:block;
  border-radius:15px;
  border:4px solid #2563eb;
  background:#000;
}

#overlay{
  position:absolute;
  left:0;
  top:0;
  width:100%;
  height:100%;
}

#diagnostico{
  background:#111827;
  color:#fff;
  padding:15px;
  border-radius:12px;
  max-width:640px;
  margin:20px auto;
  text-align:left;
  font-family:monospace;
  font-size:14px;
  line-height:1.6;
}

button{
  padding:14px 25px;
  border:0;
  border-radius:10px;
  background:#2563eb;
  color:white;
  font-size:17px;
  font-weight:bold;
  cursor:pointer;
}

button:hover{
  background:#1d4ed8;
}

</style>

</head>


<body>

<h1>AsistenciaFace</h1>

<p>Sistema biométrico de control de asistencia</p>

<div id="referencia">
  Cargando referencia facial...
</div>

<div id="estado">
  Inicializando sistema...
</div>

<div id="contenedor">

  <video
    id="video"
    autoplay
    muted
    playsinline>
  </video>

  <canvas id="overlay"></canvas>

</div>

<button id="btnCamara">
  Iniciar cámara
</button>

<div id="diagnostico">

  INICIANDO DIAGNÓSTICO...

</div>


<script>

'use strict';


/* =====================================================
   CONFIGURACIÓN
===================================================== */

const SCRIPT_URL =
'https://script.google.com/macros/s/AKfycbzppnvBRB8GnlscSQXuDy4uDut1Ckv7o7CeP8QZkStbsS0cVoggFblq6j9nw_VzUcvr/exec';

const CODIGO_EMPLEADO = 'EMP001';

const UMBRAL = 0.60;


/* =====================================================
   ELEMENTOS
===================================================== */

const video =
document.getElementById('video');

const canvas =
document.getElementById('overlay');

const estado =
document.getElementById('estado');

const referencia =
document.getElementById('referencia');

const diagnostico =
document.getElementById('diagnostico');

const btnCamara =
document.getElementById('btnCamara');


/* =====================================================
   VARIABLES
===================================================== */

let descriptorReferencia = null;

let nombreEmpleado = '';

let camaraActiva = false;

let analizando = false;

let registroRealizado = false;

let ultimoRostro = 0;


/* =====================================================
   DIAGNÓSTICO
===================================================== */

function log(mensaje){

  console.log(mensaje);

  diagnostico.innerHTML +=
    '<br>' +
    mensaje;

}


/* =====================================================
   INICIO
===================================================== */

async function iniciarSistema(){

  try{

    diagnostico.innerHTML =
      'INICIANDO SISTEMA...';

    log(
      'Cargando TinyFaceDetector...'
    );

    await faceapi.nets.tinyFaceDetector
      .loadFromUri(
        'https://cdn.jsdelivr.net/gh/justadudewhohacks/face-api.js@0.22.2/weights'
      );

    log(
      'TinyFaceDetector OK'
    );


    log(
      'Cargando FaceLandmark68...'
    );

    await faceapi.nets.faceLandmark68Net
      .loadFromUri(
        'https://cdn.jsdelivr.net/gh/justadudewhohacks/face-api.js@0.22.2/weights'
      );

    log(
      'FaceLandmark68 OK'
    );


    log(
      'Cargando FaceRecognition...'
    );

    await faceapi.nets.faceRecognitionNet
      .loadFromUri(
        'https://cdn.jsdelivr.net/gh/justadudewhohacks/face-api.js@0.22.2/weights'
      );

    log(
      'FaceRecognition OK'
    );


    estado.textContent =
      'Cargando referencia facial...';


    await cargarReferencia();


    estado.textContent =
      'Referencia cargada. Pulsa Iniciar cámara.';


    btnCamara.disabled = false;


  }
  catch(error){

    console.error(error);

    estado.textContent =
      'ERROR: ' +
      error.message;

    log(
      'ERROR: ' +
      error.message
    );

  }

}


/* =====================================================
   CARGAR REFERENCIA
===================================================== */

async function cargarReferencia(){

  log(
    'Solicitando fotografía a Apps Script...'
  );


  const callback =
    'referencia_' +
    Date.now();


  return new Promise(
    function(resolve,reject){

      window[callback] =
      function(respuesta){

        try{

          log(
            'RESPUESTA REFERENCIA RECIBIDA'
          );


          if(
            !respuesta ||
            respuesta.ok === false
          ){

            throw new Error(
              respuesta &&
              respuesta.error
              ?
              respuesta.error
              :
              'Apps Script no devolvió la referencia.'
            );

          }


          nombreEmpleado =
            respuesta.nombre ||
            CODIGO_EMPLEADO;


          referencia.textContent =
            'Referencia facial cargada: ' +
            nombreEmpleado;


          log(
            'Empleado: ' +
            nombreEmpleado
          );


          if(!respuesta.base64){

            throw new Error(
              'No se recibió Base64.'
            );

          }


          log(
            'Base64 recibido: ' +
            respuesta.base64.length +
            ' caracteres'
          );


          const img =
            new Image();


          img.onload =
          async function(){

            try{

              log(
                'Imagen de referencia cargada'
              );


              const deteccion =
                await faceapi
                .detectSingleFace(
                  img,
                  new faceapi.TinyFaceDetectorOptions({
                    inputSize:416,
                    scoreThreshold:0.35
                  })
                )
                .withFaceLandmarks()
                .withFaceDescriptor();


              if(!deteccion){

                throw new Error(
                  'No se encontró rostro en la foto de referencia.'
                );

              }


              descriptorReferencia =
                deteccion.descriptor;


              log(
                'Descriptor de referencia creado'
              );


              log(
                'Dimensión: ' +
                descriptorReferencia.length
              );


              resolve();

            }
            catch(error){

              reject(error);

            }

          };


          img.onerror =
          function(){

            reject(
              new Error(
                'No se pudo cargar la imagen de referencia.'
              )
            );

          };


          img.src =
            'data:' +
            respuesta.tipo +
            ';base64,' +
            respuesta.base64;


        }
        catch(error){

          reject(error);

        }

      };


      const script =
        document.createElement('script');


      script.src =
        SCRIPT_URL +
        '?accion=obtenerReferencia' +
        '&codigo=' +
        encodeURIComponent(
          CODIGO_EMPLEADO
        ) +
        '&callback=' +
        encodeURIComponent(
          callback
        );


      script.onerror =
      function(){

        reject(
          new Error(
            'No se pudo conectar con Apps Script.'
          )
        );

      };


      document.body.appendChild(
        script
      );

    }
  );

}


/* =====================================================
   BOTÓN CÁMARA
===================================================== */

btnCamara.addEventListener(
  'click',
  iniciarCamara
);


/* =====================================================
   INICIAR CÁMARA
===================================================== */

async function iniciarCamara(){

  if(camaraActiva){

    return;

  }


  try{

    log(
      'BOTÓN CÁMARA PRESIONADO'
    );


    estado.textContent =
      'Solicitando acceso a cámara...';


    const stream =
      await navigator.mediaDevices
      .getUserMedia({

        video:{
          width:{
            ideal:640
          },

          height:{
            ideal:480
          },

          facingMode:'user'
        },

        audio:false

      });


    log(
      'CÁMARA OBTENIDA CORRECTAMENTE'
    );


    video.srcObject =
      stream;


    await new Promise(
      function(resolve){

        if(
          video.readyState >= 2
        ){

          resolve();

          return;

        }


        video.onloadedmetadata =
        function(){

          resolve();

        };

      }
    );


    await video.play();


    log(
      'VIDEO INICIADO'
    );


    log(
      'ANCHO VIDEO: ' +
      video.videoWidth
    );


    log(
      'ALTO VIDEO: ' +
      video.videoHeight
    );


    canvas.width =
      video.videoWidth;

    canvas.height =
      video.videoHeight;


    faceapi.matchDimensions(
      canvas,
      {
        width:
          video.videoWidth,

        height:
          video.videoHeight
      }
    );


    camaraActiva =
      true;


    btnCamara.disabled =
      true;


    estado.textContent =
      'Buscando rostro...';


    iniciarDeteccion();


  }
  catch(error){

    console.error(
      'ERROR CÁMARA:',
      error
    );


    estado.textContent =
      'Error de cámara: ' +
      error.message;


    log(
      'ERROR CÁMARA: ' +
      error.message
    );

  }

}


/* =====================================================
   DETECCIÓN FACIAL
===================================================== */

function iniciarDeteccion(){

  if(analizando){

    return;

  }


  analizando = true;


  log(
    'INICIANDO DETECCIÓN FACIAL'
  );


  detectar();


}


/* =====================================================
   DETECTAR
===================================================== */

async function detectar(){

  if(
    !camaraActiva ||
    !descriptorReferencia
  ){

    setTimeout(
      detectar,
      500
    );

    return;

  }


  try{

    const detecciones =
      await faceapi
      .detectAllFaces(
        video,
        new faceapi.TinyFaceDetectorOptions({

          inputSize:416,

          scoreThreshold:0.30

        })
      )
      .withFaceLandmarks()
      .withFaceDescriptors();


    const resultados =
      faceapi.resizeResults(
        detecciones,
        {
          width:
            video.videoWidth,

          height:
            video.videoHeight
        }
      );


    const ctx =
      canvas.getContext('2d');


    ctx.clearRect(
      0,
      0,
      canvas.width,
      canvas.height
    );


    if(
      resultados.length === 0
    ){

      estado.textContent =
        'Buscando rostro...';


      log(
        'Sin rostro detectado'
      );

    }
    else{

      log(
        'ROSTROS DETECTADOS: ' +
        resultados.length
      );


      faceapi.draw.drawDetections(
        canvas,
        resultados
      );


      faceapi.draw.drawFaceLandmarks(
        canvas,
        resultados
      );


      const rostro =
        resultados[0];


      const distancia =
        faceapi.euclideanDistance(
          descriptorReferencia,
          rostro.descriptor
        );


      const confianza =
        Math.max(
          0,
          Math.min(
            100,
            (
              1 -
              distancia /
              UMBRAL
            ) * 100
          )
        ).toFixed(1);


      log(
        'DISTANCIA: ' +
        distancia.toFixed(4)
      );


      log(
        'CONFIANZA: ' +
        confianza +
        '%'
      );


      if(
        distancia <
        UMBRAL
      ){

        estado.textContent =
          nombreEmpleado +
          ' reconocido (' +
          confianza +
          '%)';


        if(
          Date.now() -
          ultimoRostro >
          1000
        ){

          ultimoRostro =
            Date.now();


          if(
            !registroRealizado
          ){

            registroRealizado =
              true;


            await registrarAsistencia();

          }

        }

      }
      else{

        estado.textContent =
          'Rostro detectado, pero no coincide (' +
          confianza +
          '%)';

      }

    }

  }
  catch(error){

    console.error(
      'ERROR DETECCIÓN:',
      error
    );


    log(
      'ERROR DETECCIÓN: ' +
      error.message
    );

  }


  setTimeout(
    detectar,
    500
  );

}


/* =====================================================
   REGISTRAR ASISTENCIA
===================================================== */

async function registrarAsistencia(){

  try{

    estado.textContent =
      'Identidad confirmada. Registrando...';


    log(
      'IDENTIDAD CONFIRMADA'
    );


    const tempCanvas =
      document.createElement(
        'canvas'
      );


    tempCanvas.width =
      video.videoWidth;

    tempCanvas.height =
      video.videoHeight;


    const ctx =
      tempCanvas.getContext(
        '2d'
      );


    ctx.drawImage(
      video,
      0,
      0
    );


    const foto =
      tempCanvas.toDataURL(
        'image/jpeg',
        0.85
      );


    log(
      'Fotografía de asistencia capturada'
    );


    navigator.geolocation.getCurrentPosition(

      function(pos){

        const datos =
        {

          empleado:
            nombreEmpleado,

          foto:
            foto,

          lat:
            pos.coords.latitude,

          lng:
            pos.coords.longitude,

          observacion:
            'Registro biométrico automático'

        };


        enviarRegistro(
          datos
        );

      },

      function(){

        const datos =
        {

          empleado:
            nombreEmpleado,

          foto:
            foto,

          observacion:
            'Registro biométrico automático - GPS no disponible'

        };


        enviarRegistro(
          datos
        );

      }

    );

  }
  catch(error){

    registroRealizado =
      false;


    estado.textContent =
      'Error: ' +
      error.message;


    log(
      'ERROR REGISTRANDO: ' +
      error.message
    );

  }

}


/* =====================================================
   ENVIAR REGISTRO
===================================================== */

function enviarRegistro(datos){

  const callback =
    'registro_' +
    Date.now();


  window[callback] =
  function(respuesta){

    try{

      log(
        'RESPUESTA REGISTRO RECIBIDA'
      );


      if(
        respuesta &&
        respuesta.ok === false
      ){

        throw new Error(
          respuesta.error
        );

      }


      estado.textContent =
        'ASISTENCIA REGISTRADA: ' +
        (
          respuesta.tipo ||
          'OK'
        );


      log(
        'REGISTRO COMPLETADO'
      );


    }
    catch(error){

      registroRealizado =
        false;


      estado.textContent =
        'Error registrando asistencia: ' +
        error.message;


      log(
        'ERROR REGISTRO: ' +
        error.message
      );

    }


    delete window[callback];

  };


  const script =
    document.createElement(
      'script'
    );


  script.src =
    SCRIPT_URL +
    '?callback=' +
    encodeURIComponent(
      callback
    ) +
    '&datos=' +
    encodeURIComponent(
      JSON.stringify(datos)
    );


  script.onerror =
  function(){

    registroRealizado =
      false;


    estado.textContent =
      'No se pudo conectar con Apps Script.';


    log(
      'ERROR DE CONEXIÓN CON APPS SCRIPT'
    );

  };


  document.body.appendChild(
    script
  );

}


/* =====================================================
   ARRANCAR
===================================================== */

window.addEventListener(
  'load',
  function(){

    btnCamara.disabled =
      true;

    iniciarSistema();

  }
);

</script>

</body>

</html>
