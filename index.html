<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>AsistenciaFace</title>

<script src="https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/dist/face-api.min.js"></script>

<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  padding:20px;
  font-family:Arial,Helvetica,sans-serif;
  background:#f3f4f6;
  text-align:center;
}

h1{
  margin:10px 0 5px;
}

#estado{
  font-size:18px;
  font-weight:bold;
  margin:15px auto;
  max-width:700px;
}

#referencia{
  margin:10px auto;
  padding:10px;
  background:#dcfce7;
  color:#166534;
  border-radius:10px;
  max-width:500px;
  font-weight:bold;
}

#contenedor{
  position:relative;
  width:640px;
  max-width:95%;
  margin:20px auto;
}

#video{
  width:100%;
  display:block;
  border-radius:15px;
  border:4px solid #2563eb;
  background:#000;
}

#overlay{
  position:absolute;
  left:0;
  top:0;
  width:100%;
  height:100%;
  pointer-events:none;
}

#diagnostico{
  background:#111827;
  color:#fff;
  padding:15px;
  border-radius:12px;
  max-width:640px;
  margin:20px auto;
  text-align:left;
  font-family:monospace;
  font-size:14px;
  line-height:1.6;
  overflow-wrap:anywhere;
}

button{
  padding:14px 25px;
  border:0;
  border-radius:10px;
  background:#2563eb;
  color:white;
  font-size:17px;
  font-weight:bold;
  cursor:pointer;
}

button:hover{
  background:#1d4ed8;
}

button:disabled{
  background:#9ca3af;
  cursor:not-allowed;
}

</style>

</head>


<body>

<h1>AsistenciaFace</h1>

<p>Sistema biométrico de control de asistencia</p>


<div id="referencia">
  Cargando referencia facial...
</div>


<div id="estado">
  Inicializando sistema...
</div>


<div id="contenedor">

  <video
    id="video"
    autoplay
    muted
    playsinline>
  </video>

  <canvas id="overlay"></canvas>

</div>


<button
  id="btnCamara"
  disabled>

  Iniciar cámara

</button>


<div id="diagnostico">

  INICIANDO DIAGNÓSTICO...

</div>


<script>

'use strict';


/* =====================================================
   CONFIGURACIÓN
===================================================== */

const SCRIPT_URL =
'https://script.google.com/macros/s/AKfycbwSnVCHj2qiKd9JfCembdLIJ8bFuFYQBJ-2D4xE25i0PHhJKDdOuAdps4aa3a5-E9sy/exec';


const CODIGO_EMPLEADO =
'EMP001';


/*
 * Distancia máxima permitida.
 *
 * Menor distancia = mayor similitud.
 */

const UMBRAL =
0.60;


/* =====================================================
   MODELOS FACE API
===================================================== */

const MODELOS_URL =
'https://cdn.jsdelivr.net/gh/justadudewhohacks/face-api.js@0.22.2/weights';


/* =====================================================
   ELEMENTOS HTML
===================================================== */

const video =
document.getElementById('video');


const canvas =
document.getElementById('overlay');


const estado =
document.getElementById('estado');


const referencia =
document.getElementById('referencia');


const diagnostico =
document.getElementById('diagnostico');


const btnCamara =
document.getElementById('btnCamara');


/* =====================================================
   VARIABLES
===================================================== */

let descriptorReferencia =
null;


let nombreEmpleado =
'';


let camaraActiva =
false;


let analizando =
false;


let registroRealizado =
false;


let ultimoRostro =
0;


/* =====================================================
   FUNCIÓN DE DIAGNÓSTICO
===================================================== */

function log(mensaje){

  console.log(mensaje);

  diagnostico.innerHTML +=
    '<br>' +
    mensaje;

}


/* =====================================================
   INICIAR SISTEMA
===================================================== */

async function iniciarSistema(){

  try{

    diagnostico.innerHTML =
      'INICIANDO SISTEMA...';


    log(
      '================================='
    );


    log(
      'INICIO DEL SISTEMA'
    );


    log(
      'URL APPS SCRIPT: ' +
      SCRIPT_URL
    );


    log(
      'CÓDIGO EMPLEADO: ' +
      CODIGO_EMPLEADO
    );


    /* ===============================================
       TINY FACE DETECTOR
    =============================================== */

    log(
      'Cargando TinyFaceDetector...'
    );


    await faceapi.nets.tinyFaceDetector.loadFromUri(
      MODELOS_URL
    );


    log(
      'TinyFaceDetector OK'
    );


    /* ===============================================
       LANDMARKS
    =============================================== */

    log(
      'Cargando FaceLandmark68...'
    );


    await faceapi.nets.faceLandmark68Net.loadFromUri(
      MODELOS_URL
    );


    log(
      'FaceLandmark68 OK'
    );


    /* ===============================================
       FACE RECOGNITION
    =============================================== */

    log(
      'Cargando FaceRecognition...'
    );


    await faceapi.nets.faceRecognitionNet.loadFromUri(
      MODELOS_URL
    );


    log(
      'FaceRecognition OK'
    );


    log(
      'MODELOS FACIALES CARGADOS CORRECTAMENTE'
    );


    estado.textContent =
      'Cargando referencia facial...';


    /* ===============================================
       OBTENER REFERENCIA
    =============================================== */

    await cargarReferencia();


    estado.textContent =
      'Referencia cargada. Pulsa Iniciar cámara.';


    btnCamara.disabled =
      false;


    log(
      '================================='
    );


    log(
      'SISTEMA LISTO'
    );


  }

  catch(error){

    console.error(
      'ERROR INICIANDO SISTEMA:',
      error
    );


    estado.textContent =
      'ERROR: ' +
      error.message;


    log(
      'ERROR INICIANDO SISTEMA: ' +
      error.message
    );


  }

}


/* =====================================================
   CARGAR REFERENCIA FACIAL
===================================================== */

async function cargarReferencia(){

  log(
    '================================='
  );


  log(
    'SOLICITANDO REFERENCIA A APPS SCRIPT'
  );


  const callback =
    'referencia_' +
    Date.now();


  return new Promise(
    function(resolve,reject){

      let terminado =
        false;


      const tiempoMaximo =
        setTimeout(
          function(){

            if(terminado){
              return;
            }


            terminado =
              true;


            delete window[callback];


            reject(
              new Error(
                'Tiempo de espera agotado al conectar con Apps Script.'
              )
            );


          },
          30000
        );


      window[callback] =
      function(respuesta){

        if(terminado){
          return;
        }


        terminado =
          true;


        clearTimeout(
          tiempoMaximo
        );


        try{

          log(
            'RESPUESTA DE REFERENCIA RECIBIDA'
          );


          if(!respuesta){

            throw new Error(
              'Apps Script devolvió una respuesta vacía.'
            );

          }


          if(respuesta.ok === false){

            throw new Error(
              respuesta.error ||
              'Apps Script devolvió un error.'
            );

          }


          nombreEmpleado =
            respuesta.nombre ||
            CODIGO_EMPLEADO;


          referencia.textContent =
            'Referencia facial cargada: ' +
            nombreEmpleado;


          log(
            'EMPLEADO: ' +
            nombreEmpleado
          );


          if(!respuesta.base64){

            throw new Error(
              'No se recibió la fotografía Base64.'
            );

          }


          log(
            'BASE64 RECIBIDO: ' +
            respuesta.base64.length +
            ' caracteres'
          );


          /* ==========================================
             CREAR IMAGEN
          ========================================== */

          const img =
            new Image();


          img.onload =
          async function(){

            try{

              log(
                'IMAGEN DE REFERENCIA CARGADA'
              );


              /* ======================================
                 DETECTAR ROSTRO EN REFERENCIA
              ====================================== */

              const deteccion =
                await faceapi
                .detectSingleFace(
                  img,
                  new faceapi.TinyFaceDetectorOptions({

                    inputSize:
                      416,

                    scoreThreshold:
                      0.35

                  })
                )
                .withFaceLandmarks()
                .withFaceDescriptor();


              if(!deteccion){

                throw new Error(
                  'No se encontró rostro en la foto de referencia.'
                );

              }


              /* ======================================
                 GUARDAR DESCRIPTOR
              ====================================== */

              descriptorReferencia =
                deteccion.descriptor;


              log(
                'DESCRIPTOR DE REFERENCIA CREADO'
              );


              log(
                'DIMENSIÓN: ' +
                descriptorReferencia.length
              );


              log(
                'REFERENCIA FACIAL OK'
              );


              resolve();


            }

            catch(error){

              reject(
                error
              );

            }

          };


          img.onerror =
          function(){

            reject(
              new Error(
                'No se pudo cargar la imagen de referencia.'
              )
            );

          };


          img.src =
            'data:' +
            respuesta.tipo +
            ';base64,' +
            respuesta.base64;


        }

        catch(error){

          reject(
            error
          );

        }

        finally{

          delete window[callback];

        }

      };


      /* ==========================================
         CREAR SCRIPT JSONP
      ========================================== */

      const script =
        document.createElement(
          'script'
        );


      script.src =
        SCRIPT_URL +
        '?accion=obtenerReferencia' +
        '&codigo=' +
        encodeURIComponent(
          CODIGO_EMPLEADO
        ) +
        '&callback=' +
        encodeURIComponent(
          callback
        );


      script.onerror =
      function(){

        if(terminado){
          return;
        }


        terminado =
          true;


        clearTimeout(
          tiempoMaximo
        );


        delete window[callback];


        reject(
          new Error(
            'No se pudo conectar con Apps Script al obtener la referencia.'
          )
        );

      };


      document.body.appendChild(
        script
      );

    }
  );

}


/* =====================================================
   BOTÓN INICIAR CÁMARA
===================================================== */

btnCamara.addEventListener(
  'click',
  iniciarCamara
);


/* =====================================================
   INICIAR CÁMARA
===================================================== */

async function iniciarCamara(){

  if(camaraActiva){

    return;

  }


  try{

    log(
      '================================='
    );


    log(
      'BOTÓN CÁMARA PRESIONADO'
    );


    estado.textContent =
      'Solicitando acceso a cámara...';


    if(
      !navigator.mediaDevices ||
      !navigator.mediaDevices.getUserMedia
    ){

      throw new Error(
        'El navegador no permite acceso a la cámara.'
      );

    }


    /* ===============================================
       SOLICITAR CÁMARA
    =============================================== */

    const stream =
      await navigator.mediaDevices.getUserMedia({

        video:{

          width:{
            ideal:640
          },

          height:{
            ideal:480
          },

          facingMode:
            'user'

        },

        audio:false

      });


    log(
      'CÁMARA OBTENIDA CORRECTAMENTE'
    );


    video.srcObject =
      stream;


    await new Promise(
      function(resolve){

        if(video.readyState >= 2){

          resolve();

          return;

        }


        video.onloadedmetadata =
        function(){

          resolve();

        };

      }
    );


    await video.play();


    log(
      'VIDEO INICIADO'
    );


    log(
      'ANCHO VIDEO: ' +
      video.videoWidth
    );


    log(
      'ALTO VIDEO: ' +
      video.videoHeight
    );


    /* ===============================================
       CONFIGURAR CANVAS
    =============================================== */

    canvas.width =
      video.videoWidth;


    canvas.height =
      video.videoHeight;


    faceapi.matchDimensions(
      canvas,
      {
        width:
          video.videoWidth,

        height:
          video.videoHeight
      }
    );


    camaraActiva =
      true;


    btnCamara.disabled =
      true;


    estado.textContent =
      'Buscando rostro...';


    log(
      'CÁMARA ACTIVA'
    );


    iniciarDeteccion();


  }

  catch(error){

    console.error(
      'ERROR CÁMARA:',
      error
    );


    estado.textContent =
      'Error de cámara: ' +
      error.message;


    log(
      'ERROR CÁMARA: ' +
      error.message
    );

  }

}


/* =====================================================
   INICIAR DETECCIÓN
===================================================== */

function iniciarDeteccion(){

  if(analizando){

    return;

  }


  analizando =
    true;


  log(
    'INICIANDO DETECCIÓN FACIAL...'
  );


  detectar();

}


/* =====================================================
   DETECCIÓN FACIAL
===================================================== */

async function detectar(){

  if(
    !camaraActiva ||
    !descriptorReferencia
  ){

    setTimeout(
      detectar,
      500
    );


    return;

  }


  try{

    const detecciones =
      await faceapi
      .detectAllFaces(
        video,
        new faceapi.TinyFaceDetectorOptions({

          inputSize:
            416,

          scoreThreshold:
            0.30

        })
      )
      .withFaceLandmarks()
      .withFaceDescriptors();


    const resultados =
      faceapi.resizeResults(
        detecciones,
        {

          width:
            video.videoWidth,

          height:
            video.videoHeight

        }
      );


    /* ===============================================
       CANVAS
    =============================================== */

    const ctx =
      canvas.getContext(
        '2d'
      );


    ctx.clearRect(
      0,
      0,
      canvas.width,
      canvas.height
    );


    /* ===============================================
       SIN ROSTRO
    =============================================== */

    if(resultados.length === 0){

      estado.textContent =
        'Buscando rostro...';

    }

    else{

      log(
        'ROSTROS DETECTADOS: ' +
        resultados.length
      );


      faceapi.draw.drawDetections(
        canvas,
        resultados
      );


      faceapi.draw.drawFaceLandmarks(
        canvas,
        resultados
      );


      const rostro =
        resultados[0];


      /* =============================================
         DISTANCIA FACIAL
      ============================================= */

      const distancia =
        faceapi.euclideanDistance(
          descriptorReferencia,
          rostro.descriptor
        );


      /* =============================================
         CONFIANZA
      ============================================= */

      const confianza =
        Math.max(
          0,
          Math.min(
            100,
            (
              1 -
              distancia /
              UMBRAL
            ) *
            100
          )
        ).toFixed(1);


      log(
        'DISTANCIA: ' +
        distancia.toFixed(4)
      );


      log(
        'CONFIANZA: ' +
        confianza +
        '%'
      );


      /* =============================================
         ROSTRO COINCIDE
      ============================================= */

      if(distancia < UMBRAL){

        estado.textContent =
          nombreEmpleado +
          ' reconocido (' +
          confianza +
          '%)';


        if(
          Date.now() -
          ultimoRostro >
          1000
        ){

          ultimoRostro =
            Date.now();


          if(!registroRealizado){

            registroRealizado =
              true;


            await registrarAsistencia();

          }

        }

      }

      else{

        estado.textContent =
          'Rostro detectado, pero no coincide (' +
          confianza +
          '%)';

      }

    }

  }

  catch(error){

    console.error(
      'ERROR DETECCIÓN:',
      error
    );


    log(
      'ERROR DETECCIÓN: ' +
      error.message
    );

  }


  setTimeout(
    detectar,
    500
  );

}


/* =====================================================
   REGISTRAR ASISTENCIA
===================================================== */

async function registrarAsistencia(){

  try{

    estado.textContent =
      'Identidad confirmada. Capturando fotografía...';


    log(
      '================================='
    );


    log(
      'IDENTIDAD CONFIRMADA'
    );


    /* ===============================================
       CAPTURAR FOTOGRAFÍA
    =============================================== */

    const tempCanvas =
      document.createElement(
        'canvas'
      );


    tempCanvas.width =
      video.videoWidth;


    tempCanvas.height =
      video.videoHeight;


    const ctx =
      tempCanvas.getContext(
        '2d'
      );


    ctx.drawImage(
      video,
      0,
      0,
      video.videoWidth,
      video.videoHeight
    );


    const foto =
      tempCanvas.toDataURL(
        'image/jpeg',
        0.85
      );


    log(
      'FOTOGRAFÍA CAPTURADA'
    );


    log(
      'TAMAÑO FOTO BASE64: ' +
      foto.length +
      ' caracteres'
    );


    /* ===============================================
       GPS
    =============================================== */

    estado.textContent =
      'Obteniendo ubicación GPS...';


    if(!navigator.geolocation){

      log(
        'GPS NO DISPONIBLE'
      );


      enviarRegistro({

        empleado:
          nombreEmpleado,

        foto:
          foto,

        observacion:
          'Registro biométrico automático - GPS no disponible'

      });


      return;

    }


    navigator.geolocation.getCurrentPosition(

      function(pos){

        log(
          'GPS OBTENIDO'
        );


        log(
          'LATITUD: ' +
          pos.coords.latitude
        );


        log(
          'LONGITUD: ' +
          pos.coords.longitude
        );


        const datos =
        {

          empleado:
            nombreEmpleado,

          foto:
            foto,

          lat:
            pos.coords.latitude,

          lng:
            pos.coords.longitude,

          observacion:
            'Registro biométrico automático'

        };


        enviarRegistro(
          datos
        );

      },

      function(error){

        log(
          'GPS NO DISPONIBLE: ' +
          error.message
        );


        const datos =
        {

          empleado:
            nombreEmpleado,

          foto:
            foto,

          observacion:
            'Registro biométrico automático - GPS no disponible'

        };


        enviarRegistro(
          datos
        );

      },

      {

        enableHighAccuracy:
          true,

        timeout:
          10000,

        maximumAge:
          0

      }

    );

  }

  catch(error){

    registroRealizado =
      false;


    estado.textContent =
      'Error: ' +
      error.message;


    log(
      'ERROR REGISTRANDO: ' +
      error.message
    );

  }

}


/* =====================================================
   ENVIAR REGISTRO A APPS SCRIPT
   MÉTODO POST
===================================================== */

function enviarRegistro(datos){

  log(
    '================================='
  );


  log(
    'ENVIANDO REGISTRO A APPS SCRIPT'
  );


  log(
    'MÉTODO: POST'
  );


  estado.textContent =
    'Registrando asistencia...';


  /* ===============================================
     IFRAME OCULTO
  =============================================== */

  const iframeName =
    'iframeRegistro_' +
    Date.now();


  const iframe =
    document.createElement(
      'iframe'
    );


  iframe.name =
    iframeName;


  iframe.id =
    iframeName;


  iframe.style.display =
    'none';


  document.body.appendChild(
    iframe
  );


  /* ===============================================
     FORMULARIO
  =============================================== */

  const formulario =
    document.createElement(
      'form'
    );


  formulario.method =
    'POST';


  formulario.action =
    SCRIPT_URL;


  formulario.target =
    iframeName;


  formulario.style.display =
    'none';


  /* ===============================================
     CONVERTIR DATOS A JSON
  =============================================== */

  let datosJSON;


  try{

    datosJSON =
      JSON.stringify(
        datos
      );

  }

  catch(error){

    log(
      'ERROR JSON: ' +
      error.message
    );


    estado.textContent =
      'Error preparando el registro.';


    iframe.remove();


    registroRealizado =
      false;


    return;

  }


  /* ===============================================
     DIAGNÓSTICO
  =============================================== */

  log(
    'DATOS PREPARADOS CORRECTAMENTE'
  );


  log(
    'EMPLEADO: ' +
    datos.empleado
  );


  log(
    'FOTO: ' +
    (
      datos.foto
        ? datos.foto.length
        : 0
    ) +
    ' caracteres'
  );


  if(
    datos.lat !== undefined &&
    datos.lng !== undefined
  ){

    log(
      'GPS: ' +
      datos.lat +
      ', ' +
      datos.lng
    );

  }

  else{

    log(
      'GPS: NO DISPONIBLE'
    );

  }


  /* ===============================================
     CAMPO DATOS
  =============================================== */

  const campoDatos =
    document.createElement(
      'input'
    );


  campoDatos.type =
    'hidden';


  campoDatos.name =
    'datos';


  campoDatos.value =
    datosJSON;


  formulario.appendChild(
    campoDatos
  );


  document.body.appendChild(
    formulario
  );


  /* ===============================================
     CONTROL DE TIEMPO
  =============================================== */

  let terminado =
    false;


  const tiempoMaximo =
    setTimeout(
      function(){

        if(terminado){

          return;

        }


        terminado =
          true;


        estado.textContent =
          'Tiempo de espera agotado al registrar.';


        log(
          'TIMEOUT ESPERANDO RESPUESTA'
        );


        try{

          formulario.remove();

        }

        catch(error){}


        try{

          iframe.remove();

        }

        catch(error){}


        registroRealizado =
          false;


      },
      30000
    );


  /* ===============================================
     RESPUESTA DEL IFRAME
  =============================================== */

  iframe.onload =
    function(){

      if(terminado){

        return;

      }


      terminado =
        true;


      clearTimeout(
        tiempoMaximo
      );


      log(
        'RESPUESTA DEL POST RECIBIDA'
      );


      estado.textContent =
        'Asistencia enviada correctamente.';


      log(
        'POST COMPLETADO'
      );


      /*
       * No ponemos registroRealizado=false aquí.
       *
       * Así evitamos que el mismo rostro registre
       * repetidamente mientras permanece frente
       * a la cámara.
       */


      setTimeout(
        function(){

          try{

            formulario.remove();

          }

          catch(error){}


          try{

            iframe.remove();

          }

          catch(error){}

        },
        1500
      );

    };


  /* ===============================================
     ERROR DEL IFRAME
  =============================================== */

  iframe.onerror =
    function(){

      if(terminado){

        return;

      }


      terminado =
        true;


      clearTimeout(
        tiempoMaximo
      );


      registroRealizado =
        false;


      estado.textContent =
        'Error enviando asistencia.';


      log(
        'ERROR CARGANDO RESPUESTA DE APPS SCRIPT'
      );


      try{

        formulario.remove();

      }

      catch(error){}


      try{

        iframe.remove();

      }

      catch(error){}

    };


  /* ===============================================
     ENVIAR FORMULARIO
  =============================================== */

  log(
    'ENVIANDO POST...'
  );


  try{

    formulario.submit();


    log(
      'POST ENVIADO CORRECTAMENTE'
    );

  }

  catch(error){

    terminado =
      true;


    clearTimeout(
      tiempoMaximo
    );


    registroRealizado =
      false;


    estado.textContent =
      'Error enviando asistencia: ' +
      error.message;


    log(
      'ERROR AL EJECUTAR POST: ' +
      error.message
    );


    try{

      formulario.remove();

    }

    catch(error){}


    try{

      iframe.remove();

    }

    catch(error){}

  }

}


/* =====================================================
   ARRANCAR APLICACIÓN
===================================================== */

window.addEventListener(
  'load',
  function(){

    btnCamara.disabled =
      true;


    iniciarSistema();

  }
);

</script>
