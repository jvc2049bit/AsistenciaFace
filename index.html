<script>

'use strict';


/* =====================================================
   CONFIGURACIÓN
===================================================== */

const SCRIPT_URL =
'https://script.google.com/macros/s/AKfycbwSnVCHj2qiKd9JfCembdLIJ8bFuFYQBJ-2D4xE25i0PHhJKDdOuAdps4aa3a5-E9sy/exec';


const CODIGO_EMPLEADO =
'EMP001';


/*
 * Distancia máxima permitida.
 *
 * Menor distancia = mayor similitud.
 */

const UMBRAL =
0.60;


/*
 * Coincidencias consecutivas.
 */

const COINCIDENCIAS_NECESARIAS =
3;


/*
 * Intervalo entre análisis.
 */

const INTERVALO_DETECCION =
500;


/*
 * Modelos Face API.
 */

const MODELOS_URL =
'https://cdn.jsdelivr.net/gh/justadudewhohacks/face-api.js@0.22.2/weights';


/* =====================================================
   ELEMENTOS
===================================================== */

const video =
document.getElementById('video');


const canvas =
document.getElementById('overlay');


const estado =
document.getElementById('estado');


const referencia =
document.getElementById('referencia');


const diagnostico =
document.getElementById('diagnostico');


const btnCamara =
document.getElementById('btnCamara');


/* =====================================================
   VARIABLES
===================================================== */

let descriptorReferencia =
null;


let nombreEmpleado =
'';


let camaraActiva =
false;


let analizando =
false;


let registroRealizado =
false;


let enviandoRegistro =
false;


let coincidenciasConsecutivas =
0;


let ultimaDistancia =
null;


let totalDetecciones =
0;


let ultimoNumeroRostros =
0;


let ultimoRostro =
0;


/* =====================================================
   DIAGNÓSTICO
===================================================== */

function log(mensaje){

  console.log(mensaje);

  diagnostico.innerHTML +=
    '<br>' +
    mensaje;

}


/* =====================================================
   LIMPIAR DIAGNÓSTICO
===================================================== */

function limpiarDiagnostico(){

  diagnostico.innerHTML =
    'DIAGNÓSTICO DEL SISTEMA';

}


/* =====================================================
   INICIO
===================================================== */

async function iniciarSistema(){

  try{

    limpiarDiagnostico();


    estado.textContent =
      'Inicializando sistema...';


    log(
      '================================='
    );


    log(
      'INICIO ASISTENCIA FACE'
    );


    log(
      '================================='
    );


    log(
      'CÓDIGO EMPLEADO: ' +
      CODIGO_EMPLEADO
    );


    log(
      'UMBRAL FACIAL: ' +
      UMBRAL
    );


    log(
      'COINCIDENCIAS NECESARIAS: ' +
      COINCIDENCIAS_NECESARIAS
    );


    /* =================================================
       TINY FACE DETECTOR
    ================================================= */

    estado.textContent =
      'Cargando detector facial...';


    log(
      'Cargando TinyFaceDetector...'
    );


    await faceapi.nets.tinyFaceDetector
      .loadFromUri(
        MODELOS_URL
      );


    log(
      'TinyFaceDetector OK'
    );


    /* =================================================
       LANDMARKS
    ================================================= */

    log(
      'Cargando FaceLandmark68...'
    );


    await faceapi.nets.faceLandmark68Net
      .loadFromUri(
        MODELOS_URL
      );


    log(
      'FaceLandmark68 OK'
    );


    /* =================================================
       RECONOCIMIENTO
    ================================================= */

    log(
      'Cargando FaceRecognition...'
    );


    await faceapi.nets.faceRecognitionNet
      .loadFromUri(
        MODELOS_URL
      );


    log(
      'FaceRecognition OK'
    );


    log(
      'TODOS LOS MODELOS FACIALES CARGADOS'
    );


    /* =================================================
       REFERENCIA
    ================================================= */

    estado.textContent =
      'Cargando referencia facial...';


    await cargarReferencia();


    estado.textContent =
      'Referencia cargada. Pulsa Iniciar cámara.';


    referencia.textContent =
      'Referencia facial cargada: ' +
      nombreEmpleado;


    btnCamara.disabled =
      false;


    log(
      'SISTEMA LISTO'
    );


  }

  catch(error){

    console.error(
      'ERROR INICIANDO SISTEMA:',
      error
    );


    estado.textContent =
      'ERROR: ' +
      error.message;


    log(
      'ERROR DE INICIALIZACIÓN: ' +
      error.message
    );

  }

}


/* =====================================================
   CARGAR REFERENCIA
===================================================== */

async function cargarReferencia(){

  log(
    'Solicitando fotografía a Apps Script...'
  );


  const callback =
    'referencia_' +
    Date.now();


  return new Promise(
    function(resolve,reject){

      let terminado =
        false;


      const tiempoMaximo =
        setTimeout(
          function(){

            if(terminado){
              return;
            }


            terminado =
              true;


            delete window[callback];


            reject(
              new Error(
                'Tiempo de espera agotado al conectar con Apps Script.'
              )
            );

          },
          30000
        );


      window[callback] =
      function(respuesta){

        if(terminado){
          return;
        }


        terminado =
          true;


        clearTimeout(
          tiempoMaximo
        );


        try{

          log(
            'RESPUESTA DE REFERENCIA RECIBIDA'
          );


          if(!respuesta){

            throw new Error(
              'Apps Script devolvió una respuesta vacía.'
            );

          }


          if(respuesta.ok === false){

            throw new Error(
              respuesta.error ||
              'Apps Script devolvió un error.'
            );

          }


          nombreEmpleado =
            respuesta.nombre ||
            CODIGO_EMPLEADO;


          log(
            'EMPLEADO: ' +
            nombreEmpleado
          );


          if(!respuesta.base64){

            throw new Error(
              'No se recibió la fotografía Base64.'
            );

          }


          log(
            'BASE64 RECIBIDO: ' +
            respuesta.base64.length +
            ' caracteres'
          );


          const img =
            new Image();


          img.onload =
          async function(){

            try{

              log(
                'IMAGEN DE REFERENCIA CARGADA'
              );


              const deteccion =
                await faceapi
                .detectSingleFace(
                  img,
                  new faceapi.TinyFaceDetectorOptions({

                    inputSize:
                      416,

                    scoreThreshold:
                      0.35

                  })
                )
                .withFaceLandmarks()
                .withFaceDescriptor();


              if(!deteccion){

                throw new Error(
                  'No se encontró rostro en la foto de referencia.'
                );

              }


              descriptorReferencia =
                deteccion.descriptor;


              log(
                'DESCRIPTOR DE REFERENCIA CREADO'
              );


              log(
                'DIMENSIÓN: ' +
                descriptorReferencia.length
              );


              log(
                'REFERENCIA FACIAL OK'
              );


              resolve();

            }

            catch(error){

              reject(error);

            }

          };


          img.onerror =
          function(){

            reject(
              new Error(
                'No se pudo cargar la imagen de referencia.'
              )
            );

          };


          img.src =
            'data:' +
            respuesta.tipo +
            ';base64,' +
            respuesta.base64;

        }

        catch(error){

          reject(error);

        }

        finally{

          delete window[callback];

        }

      };


      const script =
        document.createElement(
          'script'
        );


      script.src =
        SCRIPT_URL +
        '?accion=obtenerReferencia' +
        '&codigo=' +
        encodeURIComponent(
          CODIGO_EMPLEADO
        ) +
        '&callback=' +
        encodeURIComponent(
          callback
        );


      script.onerror =
      function(){

        if(terminado){
          return;
        }


        terminado =
          true;


        clearTimeout(
          tiempoMaximo
        );


        delete window[callback];


        reject(
          new Error(
            'No se pudo conectar con Apps Script al obtener la referencia.'
          )
        );

      };


      document.body.appendChild(
        script
      );

    }
  );

}


/* =====================================================
   BOTÓN CÁMARA
===================================================== */

btnCamara.addEventListener(
  'click',
  iniciarCamara
);


/* =====================================================
   INICIAR CÁMARA
===================================================== */

async function iniciarCamara(){

  if(camaraActiva){

    log(
      'La cámara ya está activa.'
    );

    return;

  }


  try{

    log(
      'BOTÓN CÁMARA PRESIONADO'
    );


    estado.textContent =
      'Solicitando acceso a cámara...';


    if(
      !navigator.mediaDevices ||
      !navigator.mediaDevices.getUserMedia
    ){

      throw new Error(
        'El navegador no permite acceso a la cámara.'
      );

    }


    const stream =
      await navigator.mediaDevices
      .getUserMedia({

        video:{

          width:{
            ideal:640
          },

          height:{
            ideal:480
          },

          facingMode:
            'user'

        },

        audio:false

      });


    log(
      'CÁMARA OBTENIDA CORRECTAMENTE'
    );


    video.srcObject =
      stream;


    await new Promise(
      function(resolve){

        if(video.readyState >= 2){

          resolve();

          return;

        }


        video.onloadedmetadata =
        function(){

          resolve();

        };

      }
    );


    await video.play();


    log(
      'VIDEO INICIADO'
    );


    log(
      'ANCHO VIDEO: ' +
      video.videoWidth
    );


    log(
      'ALTO VIDEO: ' +
      video.videoHeight
    );


    canvas.width =
      video.videoWidth;


    canvas.height =
      video.videoHeight;


    faceapi.matchDimensions(
      canvas,
      {

        width:
          video.videoWidth,

        height:
          video.videoHeight

      }
    );


    camaraActiva =
      true;


    btnCamara.disabled =
      true;


    estado.textContent =
      'Buscando rostro...';


    log(
      'CÁMARA ACTIVA'
    );


    iniciarDeteccion();

  }

  catch(error){

    console.error(
      'ERROR CÁMARA:',
      error
    );


    estado.textContent =
      'Error de cámara: ' +
      error.message;


    log(
      'ERROR CÁMARA: ' +
      error.message
    );

  }

}


/* =====================================================
   INICIAR DETECCIÓN
===================================================== */

function iniciarDeteccion(){

  if(analizando){

    return;

  }


  analizando =
    true;


  log(
    'INICIANDO DETECCIÓN FACIAL'
  );


  log(
    'Se necesitan ' +
    COINCIDENCIAS_NECESARIAS +
    ' coincidencias consecutivas.'
  );


  detectar();

}


/* =====================================================
   DETECCIÓN FACIAL
===================================================== */

async function detectar(){

  if(
    !camaraActiva ||
    !descriptorReferencia
  ){

    setTimeout(
      detectar,
      INTERVALO_DETECCION
    );

    return;

  }


  if(registroRealizado){

    return;

  }


  try{

    totalDetecciones++;


    const detecciones =
      await faceapi
      .detectAllFaces(
        video,
        new faceapi.TinyFaceDetectorOptions({

          inputSize:
            416,

          scoreThreshold:
            0.30

        })
      )
      .withFaceLandmarks()
      .withFaceDescriptors();


    const resultados =
      faceapi.resizeResults(
        detecciones,
        {

          width:
            video.videoWidth,

          height:
            video.videoHeight

        }
      );


    const ctx =
      canvas.getContext(
        '2d'
      );


    ctx.clearRect(
      0,
      0,
      canvas.width,
      canvas.height
    );


    ultimoNumeroRostros =
      resultados.length;


    if(resultados.length === 0){

      coincidenciasConsecutivas =
        0;


      ultimaDistancia =
        null;


      estado.textContent =
        'Buscando rostro...';

    }

    else{

      faceapi.draw.drawDetections(
        canvas,
        resultados
      );


      faceapi.draw.drawFaceLandmarks(
        canvas,
        resultados
      );


      log(
        'ROSTROS DETECTADOS: ' +
        resultados.length
      );


      const rostro =
        resultados[0];


      const distancia =
        faceapi.euclideanDistance(
          descriptorReferencia,
          rostro.descriptor
        );


      ultimaDistancia =
        distancia;


      log(
        'DISTANCIA: ' +
        distancia.toFixed(4)
      );


      if(distancia < UMBRAL){

        coincidenciasConsecutivas++;


        if(
          coincidenciasConsecutivas >
          COINCIDENCIAS_NECESARIAS
        ){

          coincidenciasConsecutivas =
            COINCIDENCIAS_NECESARIAS;

        }


        log(
          'COINCIDENCIA: SÍ'
        );


        log(
          'PROGRESO: ' +
          coincidenciasConsecutivas +
          '/' +
          COINCIDENCIAS_NECESARIAS
        );


        estado.textContent =
          'Rostro coincidente ' +
          coincidenciasConsecutivas +
          '/' +
          COINCIDENCIAS_NECESARIAS;


        if(
          coincidenciasConsecutivas >=
          COINCIDENCIAS_NECESARIAS
        ){

          if(
            !registroRealizado &&
            !enviandoRegistro
          ){

            registroRealizado =
              true;


            ultimoRostro =
              Date.now();


            log(
              '3 COINCIDENCIAS CONSECUTIVAS'
            );


            log(
              'IDENTIDAD CONFIRMADA'
            );


            await registrarAsistencia();

          }

        }

      }

      else{

        coincidenciasConsecutivas =
          0;


        log(
          'COINCIDENCIA: NO'
        );


        estado.textContent =
          'Rostro detectado, pero no coincide.';

      }

    }

  }

  catch(error){

    console.error(
      'ERROR DETECCIÓN:',
      error
    );


    log(
      'ERROR DETECCIÓN: ' +
      error.message
    );

  }


  if(!registroRealizado){

    setTimeout(
      detectar,
      INTERVALO_DETECCION
    );

  }

}


/* =====================================================
   REGISTRAR ASISTENCIA
===================================================== */

async function registrarAsistencia(){

  if(enviandoRegistro){

    log(
      'REGISTRO YA EN PROCESO.'
    );

    return;

  }


  enviandoRegistro =
    true;


  try{

    estado.textContent =
      'Identidad confirmada. Capturando fotografía...';


    const tempCanvas =
      document.createElement(
        'canvas'
      );


    tempCanvas.width =
      video.videoWidth;


    tempCanvas.height =
      video.videoHeight;


    const ctx =
      tempCanvas.getContext(
        '2d'
      );


    ctx.drawImage(
      video,
      0,
      0,
      video.videoWidth,
      video.videoHeight
    );


    const foto =
      tempCanvas.toDataURL(
        'image/jpeg',
        0.85
      );


    log(
      'FOTOGRAFÍA CAPTURADA'
    );


    log(
      'TAMAÑO FOTO: ' +
      foto.length +
      ' caracteres'
    );


    estado.textContent =
      'Obteniendo ubicación GPS...';


    if(!navigator.geolocation){

      await enviarRegistro({

        empleado:
          nombreEmpleado,

        foto:
          foto,

        observacion:
          'Registro biométrico automático - GPS no disponible'

      });

      return;

    }


    navigator.geolocation.getCurrentPosition(

      async function(pos){

        log(
          'GPS OBTENIDO'
        );


        log(
          'LATITUD: ' +
          pos.coords.latitude
        );


        log(
          'LONGITUD: ' +
          pos.coords.longitude
        );


        await enviarRegistro({

          empleado:
            nombreEmpleado,

          foto:
            foto,

          lat:
            pos.coords.latitude,

          lng:
            pos.coords.longitude,

          observacion:
            'Registro biométrico automático'

        });

      },

      async function(error){

        log(
          'GPS NO DISPONIBLE: ' +
          error.message
        );


        await enviarRegistro({

          empleado:
            nombreEmpleado,

          foto:
            foto,

          observacion:
            'Registro biométrico automático - GPS no disponible'

        });

      },

      {

        enableHighAccuracy:
          true,

        timeout:
          10000,

        maximumAge:
          0

      }

    );

  }

  catch(error){

    registroRealizado =
      false;


    enviandoRegistro =
      false;


    estado.textContent =
      'Error: ' +
      error.message;


    log(
      'ERROR REGISTRANDO: ' +
      error.message
    );

  }

}


/* =====================================================
   ENVIAR REGISTRO - POST
===================================================== */

function enviarRegistro(datos){

  return new Promise(
    function(resolve){

      log(
        'MÉTODO: POST'
      );


      log(
        'ENVIANDO REGISTRO A APPS SCRIPT...'
      );


      estado.textContent =
        'Registrando asistencia...';


      const iframeName =
        'iframeRegistro_' +
        Date.now();


      const iframe =
        document.createElement(
          'iframe'
        );


      iframe.name =
        iframeName;


      iframe.id =
        iframeName;


      iframe.style.display =
        'none';


      document.body.appendChild(
        iframe
      );


      const formulario =
        document.createElement(
          'form'
        );


      formulario.method =
        'POST';


      formulario.action =
        SCRIPT_URL;


      formulario.target =
        iframeName;


      formulario.style.display =
        'none';


      let datosJSON;


      try{

        datosJSON =
          JSON.stringify(
            datos
          );

      }

      catch(error){

        log(
          'ERROR CONVIRTIENDO DATOS: ' +
          error.message
        );


        registroRealizado =
          false;


        enviandoRegistro =
          false;


        iframe.remove();


        resolve();

        return;

      }


      log(
        'DATOS PREPARADOS CORRECTAMENTE'
      );


      log(
        'EMPLEADO: ' +
        datos.empleado
      );


      log(
        'FOTO: ' +
        (
          datos.foto
            ? datos.foto.length
            : 0
        ) +
        ' caracteres'
      );


      if(
        datos.lat !== undefined &&
        datos.lng !== undefined
      ){

        log(
          'GPS: ' +
          datos.lat +
          ', ' +
          datos.lng
        );

      }

      else{

        log(
          'GPS: NO DISPONIBLE'
        );

      }


      const campoDatos =
        document.createElement(
          'input'
        );


      campoDatos.type =
        'hidden';


      campoDatos.name =
        'datos';


      campoDatos.value =
        datosJSON;


      formulario.appendChild(
        campoDatos
      );


      document.body.appendChild(
        formulario
      );


      let terminado =
        false;


      const tiempoMaximo =
        setTimeout(
          function(){

            if(terminado){

              return;

            }


            terminado =
              true;


            estado.textContent =
              'Tiempo de espera agotado al registrar.';


            log(
              'TIMEOUT ESPERANDO APPS SCRIPT'
            );


            registroRealizado =
              false;


            enviandoRegistro =
              false;


            try{
              formulario.remove();
            }
            catch(error){}


            try{
              iframe.remove();
            }
            catch(error){}


            resolve();

          },
          30000
        );


      iframe.onload =
      function(){

        if(terminado){

          return;

        }


        terminado =
          true;


        clearTimeout(
          tiempoMaximo
        );


        log(
          'RESPUESTA DEL POST RECIBIDA'
        );


        estado.textContent =
          'Asistencia registrada correctamente.';


        log(
          'POST COMPLETADO'
        );


        log(
          'REGISTRO ENVIADO A APPS SCRIPT'
        );


        /*
         * Bloqueo definitivo durante esta sesión.
         */

        registroRealizado =
          true;


        enviandoRegistro =
          false;


        setTimeout(
          function(){

            try{
              formulario.remove();
            }
            catch(error){}


            try{
              iframe.remove();
            }
            catch(error){}

          },
          1500
        );


        resolve();

      };


      iframe.onerror =
      function(){

        if(terminado){

          return;

        }


        terminado =
          true;


        clearTimeout(
          tiempoMaximo
        );


        registroRealizado =
          false;


        enviandoRegistro =
          false;


        estado.textContent =
          'Error enviando asistencia.';


        log(
          'ERROR CARGANDO RESPUESTA DE APPS SCRIPT'
        );


        try{
          formulario.remove();
        }
        catch(error){}


        try{
          iframe.remove();
        }
        catch(error){}


        resolve();

      };


      log(
        'ENVIANDO POST...'
      );


      try{

        formulario.submit();


        log(
          'POST ENVIADO CORRECTAMENTE'
        );

      }

      catch(error){

        terminado =
          true;


        clearTimeout(
          tiempoMaximo
        );


        registroRealizado =
          false;


        enviandoRegistro =
          false;


        estado.textContent =
          'Error enviando asistencia: ' +
          error.message;


        log(
          'ERROR AL EJECUTAR POST: ' +
          error.message
        );


        try{
          formulario.remove();
        }
        catch(error){}


        try{
          iframe.remove();
        }
        catch(error){}


        resolve();

      }

    }
  );

}


/* =====================================================
   ARRANCAR SISTEMA
===================================================== */

window.addEventListener(
  'load',
  function(){

    btnCamara.disabled =
      true;


    iniciarSistema();

  }
);

</script>
